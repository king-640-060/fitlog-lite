<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent}body{background:#e8e9e8;color:var(--text)}button,input{font:inherit}button{cursor:pointer;transition:background .12s,color .12s;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}p,h1,h2,h3{margin:0}h1{font-size:29px;letter-spacing:-.04em}h2{font-size:20px;line-height:1.35}h3{font-size:16px}.page{position:relative;width:min(100%,445px);min-height:100dvh;margin:auto;background:var(--bg);overflow:hidden;padding-bottom:105px}.top{padding:38px 22px 12px}.status{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);margin:0 0 35px}.top .subtitle{color:var(--muted);margin-top:6px;font-size:14px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:1;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,445px);background:var(--surface);border-top:1px solid var(--border);padding:9px 8px calc(11px + var(--bottom-safe));border-radius:18px 18px 0 0}.tabs>div{text-align:center;font-size:12px;color:var(--muted);padding:7px 3px}.tabs .selected{background:var(--accent-soft);border-radius:13px;color:var(--accent2);font-weight:700}.content{padding:12px 18px;display:grid;gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 1px 2px #14261605}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:18px}.cardhead h2{font-size:18px}.link{background:transparent;color:var(--accent2);font-weight:600;padding:8px 0;min-height:44px}.eyebrow{font-size:12px;color:var(--muted)}.kcal{font-size:38px;font-weight:750;letter-spacing:-.035em;margin:7px 0}.kcal small{font-size:15px;color:var(--muted);font-weight:500}.ring{width:106px;height:106px;border-radius:50%;background:conic-gradient(var(--accent) 0 35%,var(--surface-soft) 35% 100%);display:grid;place-items:center}.ring>div{width:78px;height:78px;border-radius:100%;background:var(--surface);display:grid;place-content:center;text-align:center;font-size:13px;font-weight:700}.summary-top{display:flex;justify-content:space-between;align-items:center}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.macro{border-radius:12px;background:var(--surface-sub);padding:11px 8px;min-height:76px}.macro span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.macro strong{font-size:16px}.minor-card{padding:16px 19px}.minor-card h3{margin-bottom:8px}.minor-card p{font-size:13px;color:var(--muted);line-height:1.65}.hint{margin:4px 3px 0;font-size:11px;color:var(--muted);line-height:1.6}
/* Bottom sheet has one stable outer frame across picker, variant and editor states; only body scrolls. */
.overlay{position:fixed;inset:0;z-index:30;display:none}.overlay.open{display:block}.shade{position:absolute;inset:0;background:var(--dim)}.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--keyboard);height:min(var(--sheet-max),calc(var(--vvh) - 14px));width:min(100%,520px);background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -15px 65px #16271823;overflow:hidden;animation:up .2s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:.82;translate:0 16px}to{opacity:1;translate:0 0}}.handle{height:4px;width:36px;background:#d6dacf;border-radius:2px;margin:9px auto 4px;flex:none}.sheethead{flex:none;display:flex;align-items:center;gap:9px;padding:10px 16px 14px;border-bottom:1px solid var(--border);background:var(--surface);min-height:65px}.sheethead h2{flex:1;font-size:18px}.headbtn{min-width:44px;height:44px;display:grid;place-items:center;background:transparent;border-radius:12px;color:var(--muted);font-size:24px}.headbtn:hover{background:var(--surface-soft)}.sheetbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-behavior:auto;-webkit-overflow-scrolling:touch;padding:20px 18px 24px;scroll-padding:30px 0 70px}.sheetfoot{flex:none;background:var(--surface);border-top:1px solid var(--border);padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:7px;box-shadow:0 -4px 10px #20300f05}.primary,.secondary,.outline{min-height:46px;border-radius:13px;font-weight:700;padding:11px 15px}.primary{background:var(--accent);color:white}.secondary{background:var(--accent-soft);color:var(--accent2)}.outline{background:transparent;color:var(--accent2);border:1px solid var(--border)}.full{width:100%}.sectiontitle{margin:0 0 10px;font-size:14px;font-weight:700}.sub{color:var(--muted);font-size:13px;line-height:1.65}.section{margin-top:24px}.section:first-child{margin-top:0}.date-chip{border-radius:999px;padding:7px 11px;background:var(--surface-soft);display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}.list{display:grid;gap:10px;margin-top:12px}.tile{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:15px;min-height:72px;border-radius:17px;border:1px solid var(--border);background:var(--surface);color:var(--text)}.tile .tile-icon{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;background:var(--surface-soft);color:var(--accent2);font-size:20px}.tile .tile-info{flex:1;min-width:0}.tile strong{font-size:15px;display:block;margin-bottom:5px}.tile small{font-size:12px;color:var(--muted);line-height:1.4}.tile .chev{color:var(--muted);font-size:21px}.tile.select{border-color:#a7b995;background:#f2f5e9}.tile .multiline{font-size:12px;display:block;line-height:1.65;color:var(--muted)}.pill{border-radius:8px;padding:3px 7px;background:var(--accent-soft);color:var(--accent2);font-size:11px;white-space:nowrap}.value{font-variant-numeric:tabular-nums;font-size:16px;font-weight:700}.small-action{display:block;margin:14px auto 0;background:transparent;min-height:44px;color:var(--accent2);font-weight:600;font-size:14px}.fine{border-top:1px solid var(--border);padding-top:14px;margin-top:18px}.note{background:var(--surface-sub);border-radius:13px;padding:12px 13px;color:var(--muted);font-size:12px;line-height:1.65}.tagline{font-size:12px;color:var(--muted);margin:4px 0 0}.field{display:grid;gap:7px;margin-bottom:18px;font-size:14px;font-weight:650}.field input{width:100%;min-height:49px;border:1px solid #d8ded2;background:var(--surface);color:var(--text);border-radius:12px;padding:10px 13px;outline-offset:0;font-size:16px}.field small{font-weight:400;font-size:12px;color:var(--muted)}.fieldrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fieldrow .field{min-width:0}.linehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.linehead h3{font-size:16px}.badge{background:var(--accent-soft);color:var(--accent2);font-size:12px;font-weight:700;border-radius:8px;padding:5px 8px}.variantcard{border:1px solid var(--border);padding:13px 15px;border-radius:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.variantcard strong{display:block;font-size:14px}.variantcard p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}.textaction{background:transparent;color:var(--accent2);padding:11px 4px;min-height:44px;font-size:13px;font-weight:700}.empty{border:1px dashed #bcc9b2;background:var(--surface-sub);padding:18px 14px;border-radius:13px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}.compare{display:grid;gap:10px}.compare .row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:12px;min-height:38px;font-size:14px}.compare .row span{color:var(--muted)}.compare .row strong{font-variant-numeric:tabular-nums}.alert{color:var(--danger);font-size:12px;line-height:1.5;min-height:0}.mini{font-size:12px;color:var(--muted);line-height:1.6}.steps{display:flex;gap:5px;align-items:center;margin:7px 0 17px}.steps i{display:block;height:4px;flex:1;border-radius:8px;background:var(--border)}.steps i.done{background:var(--accent)}.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:45;background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 26px #17221725;padding:13px 17px;border-radius:999px;color:var(--accent2);font-weight:700;font-size:13px;white-space:nowrap;max-width:90vw}.no-display{display:none!important}.testbar{position:fixed;top:10px;right:max(10px,calc((100vw - 445px)/2 + 10px));z-index:4}.testbar button{background:#fffdf7bf;color:#67765b;border:1px solid #d6ddcf;border-radius:999px;font-size:11px;padding:8px}.simkeyboard{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:290px;background:#d3d5da;z-index:31;display:none;justify-content:center;align-items:start;padding-top:28px;color:#535962;font-size:14px}.simkeyboard.on{display:flex}body.sheet-lock{overflow:hidden}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#171d18;--surface:#232b23;--surface-sub:#293229;--surface-soft:#2e3b2b;--text:#e7ebe4;--muted:#a7b4a2;--border:#3a4738;--accent:#64894c;--accent2:#b9d99b;--accent-soft:#344930;--dim:rgba(0,0,0,.65)}body{background:#121612}.field input{border-color:var(--border)}.tile.select{background:#2a3c29;border-color:#567a48}.handle{background:#576353}.testbar button{background:#293229;color:#d5dfd2;border-color:#44543c}}
@media(max-width:360px){.top{padding-left:16px;padding-right:16px}.content{padding-left:13px;padding-right:13px}.card{padding:17px}.sheetbody{padding:17px 15px 20px}.sheetfoot{padding-left:15px;padding-right:15px}.fieldrow{gap:9px}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}button{transition:none}}
</style>
</head>
<body>
<main class="page">
  <header class="top"><div class="status"><span>17:00</span><span>●●● 5G ▣</span></div><h1>饮食</h1><p class="subtitle">认真记录，也合理规划</p></header>
  <div class="content">
    <section class="card"><div class="cardhead"><h2>饮食总览</h2><button class="link" id="openGoals" type="button"><span id="goalEntry">设置目标</span> &rsaquo;</button></div><span class="eyebrow">今天 · 10月19日</span><div class="summary-top"><div><div class="kcal">1,420 <small>kcal</small></div><p class="sub" id="homeGoalCaption">尚未设置当日目标</p></div><div class="ring"><div>已记录<br><strong>1420</strong></div></div></div><div class="macros"><div class="macro"><span>蛋白质</span><strong id="homeP">96 g</strong></div><div class="macro"><span>碳水</span><strong id="homeC">165 g</strong></div><div class="macro"><span>脂肪</span><strong id="homeF">46 g</strong></div></div><div class="fine mini" id="homeSource">已记录的饮食不会因设置营养目标而改变。</div></section>
    <section class="card minor-card"><h3>已记录饮食</h3><p>早餐 · 燕麦、鸡蛋与牛奶<br>午餐 · 米饭、鸡胸肉与蔬菜<br>这里仅作演示，操作不会保存到真实账户。</p></section>
    <p class="hint">交互原型 v0.2 · 演示数据只保存在当前页面。模板启用与当日目标应用分别确认，绝不会改写你手机的真实记录。</p>
  </div>
  <nav class="tabs" aria-label="底部导航"><div>⌂<br>今日</div><div>▦<br>计划</div><div class="selected">♜<br>饮食</div><div>◇<br>训练</div><div>⌁<br>进度</div></nav>
</main>
<div class="overlay" id="overlay" aria-hidden="true"><div class="shade" data-action="close"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><header class="sheethead"><button type="button" class="headbtn" id="back" data-action="back" aria-label="返回">‹</button><h2 tabindex="-1" id="sheetTitle">设置目标</h2><button type="button" class="headbtn" data-action="close" aria-label="关闭">×</button></header><div class="sheetbody" id="sheetBody"></div><footer class="sheetfoot" id="sheetFoot"></footer></section></div>
<div class="simkeyboard" id="simKeyboard" aria-hidden="true">键盘占位模拟 · 内容在 Sheet 内滚动</div>
<div class="testbar"><button type="button" id="keyboardDemo" hidden>演示键盘</button></div>
<div class="toast" id="toast" hidden></div>
<script>
(()=>{
 const $=(s,r=document)=>r.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const today='2026-10-19',formatDay='2026年10月19日';
 let templates=[{id:'v1',name:'V1 · 减脂策略',active:false,variants:[{id:'v1a',name:'训练日',calories:2250,protein:160,carbs:250,fat:65},{id:'v1b',name:'休息日',calories:1950,protein:160,carbs:175,fat:65},{id:'v1c',name:'有氧日',calories:2100,protein:160,carbs:210,fat:65}]}];
 let applied=null,screen='picker',stack=[],chosenTemplate=null,chosenVariant=null,draft=null,draftVariant=null,editingIndex=null,dirty=false,simKeyboard=false,scrollMemory=0,toastTimer;
 const overlay=$('#overlay'),body=$('#sheetBody'),foot=$('#sheetFoot'),head=$('#sheetTitle');
 const btn=(text,action,cls='primary')=>`<button type="button" data-action="${action}" class="${cls} full">${text}</button>`;
 const goalTxt=(v)=>[v?.calories===undefined?'—':v.calories+' kcal',v?.protein===undefined?'—':v.protein+' g',v?.carbs===undefined?'—':v.carbs+' g',v?.fat===undefined?'—':v.fat+' g'].join('　·　');
 const notice=msg=>{const n=$('#toast');n.textContent=msg;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,2800)};
 const selectedDate=()=>`<span class="date-chip">◷ 今天 · ${formatDay}</span>`;
 const entryTile=t=>`<button type="button" class="tile" data-action="choose-template" data-id="${esc(t.id)}"><span class="tile-icon">▤</span><span class="tile-info"><strong>${esc(t.name)}</strong><small>${t.variants.length} 个日方案 · ${t.active?'当前正在使用':'尚未启用'}</small></span>${t.active?'<span class="pill">使用中</span>':''}<span class="chev">›</span></button>`;
 function printScreen(){
   let html='',footer='',title='',back=true;
   if(screen==='picker'){
    title='设置当日营养目标';back=false;
    html=`${selectedDate()}<div class="section"><h3 class="sectiontitle">选择已有营养模板</h3><p class="sub">直接选用模板，再选择今天的日方案；不会立刻覆盖已有目标。</p><div class="list">${templates.length?templates.map(entryTile).join(''):'<div class="empty">还没有营养模板，可先创建一个。</div>'}</div></div><div class="section">${btn('＋ 新建营养模板','new-template','secondary')}<button type="button" class="small-action" data-action="manual">手动设置当日目标 ›</button></div><div class="section note">${applied?`今天已设置：${esc(applied.templateName||'自定义目标')}。再次应用时会明确提示替换当天目标。`:'模板是可复用的营养计划。保存模板本身不会修改今天或过去的实际饮食记录。'}${templates.some(t=>t.active)?' 同一时间只允许一个模板处于使用中状态。':''}</div>`;
   }else if(screen==='activate'){
    const t=chosenTemplate;title='启用营养模板';
    const previousActive=templates.find(other=>other.active&&other.id!==t.id);
    html=`<div class="steps"><i class="done"></i><i></i><i></i></div>${selectedDate()}<div class="section"><h3 class="sectiontitle">${esc(t.name)}</h3><p class="sub">这个模板已经存在，但尚未在今天启用。</p><div class="note" style="margin-top:15px"><strong>开始使用日期</strong><p>${formatDay}（演示选择日期）</p><br>${previousActive?`确认启用后，当前使用的「${esc(previousActive.name)}」将结束使用，新模板成为唯一的当前模板。先前已保存的每日目标保持不变。`:'启用只创建模板使用阶段，不会自动填入营养目标，也不会删除或修改历史数据。'}</div></div>`;
    footer=btn('确认启用并选择日方案','activate-template')+`<p class="mini">下一步还要选择具体日方案并确认应用。</p>`;
   }else if(screen==='variants'){
    const t=chosenTemplate;title='选择日方案';html=`<div class="steps"><i class="done"></i><i class="done"></i><i></i></div>${selectedDate()}<div class="section"><p class="sub">当前模板：<strong>${esc(t.name)}</strong></p><div class="list">${t.variants.map(v=>`<button class="tile ${chosenVariant?.id===v.id?'select':''}" type="button" data-action="choose-variant" data-id="${esc(v.id)}"><span class="tile-info"><strong>${esc(v.name)}</strong><small class="multiline">${esc(goalTxt(v))}</small></span><span class="chev">${chosenVariant?.id===v.id?'✓':'›'}</span></button>`).join('')}</div></div><p class="note section">模板允许不同训练日采用不同目标。今天只应用你最终确认的一个方案。</p>`;
    footer=btn('预览并确认当天目标','show-preview')
   }else if(screen==='preview'){
    const v=chosenVariant,t=chosenTemplate;title='确认应用营养目标';
    html=`<div class="steps"><i class="done"></i><i class="done"></i><i class="done"></i></div>${selectedDate()}<div class="section"><h3 class="sectiontitle">即将应用</h3><p class="sub">${esc(t.name)} · ${esc(v.name)}</p><div class="compare section">${[['热量','calories','kcal'],['蛋白质','protein','g'],['碳水','carbs','g'],['脂肪','fat','g']].map(([n,k,u])=>`<div class="row"><span>${n}</span><strong>${v[k]===undefined?'未设':esc(v[k])+' '+u}</strong></div>`).join('')}</div></div><p class="note section">${applied?'今天已有保存目标；确认后只替换今天的目标快照。':'确认后只设置今天的目标。'}实际饮食记录、其他日期目标和计划任务均不受影响。</p>`;
    footer=btn(applied?'确认替换今天的目标':'应用到今天','apply-target');
   }else if(screen==='editor'){
    title='新建营养模板';
    html=`<div class="section"><label class="field">模板名称<input id="templateName" name="templateName" placeholder="例如：减脂策略 V2" maxlength="80" value="${esc(draft.name)}" autocomplete="off"></label></div><div class="section"><div class="linehead"><h3>日方案</h3><span class="badge">${draft.variants.length} / 32</span></div>${draft.variants.length?draft.variants.map((v,i)=>`<div class="variantcard"><div><strong>${esc(v.name)}</strong><p>${esc(goalTxt(v))}</p></div><button type="button" class="textaction" data-action="edit-variant" data-index="${i}">编辑</button></div>`).join(''):'<div class="empty">还没有日方案。建议先添加「训练日」「休息日」等。</div>'}<button type="button" data-action="add-variant" class="secondary full" style="margin-top:12px">＋ 添加日方案</button></div><p class="note section">模板可保存多个日方案。保存模板后不会自动启用，也不会修改任何历史目标。</p>`;
    footer=btn('保存营养模板','save-template');
   }else if(screen==='variantEditor'){
    title=editingIndex===null?'添加日方案':'编辑日方案';
    html=`<div class="section"><label class="field">方案名称<input id="variantName" placeholder="例如：训练日" maxlength="80" value="${esc(draftVariant.name)}" autocomplete="off"></label><div class="linehead"><h3>营养目标</h3><span class="mini">可只填写需要的项目</span></div><div class="fieldrow"><label class="field">热量 <small>kcal</small><input data-macro="calories" inputmode="decimal" type="number" min="0" step="1" placeholder="2200" value="${esc(draftVariant.calories??'')}"></label><label class="field">蛋白质 <small>g</small><input data-macro="protein" inputmode="decimal" type="number" min="0" step="0.1" placeholder="160" value="${esc(draftVariant.protein??'')}"></label><label class="field">碳水 <small>g</small><input data-macro="carbs" inputmode="decimal" type="number" min="0" step="0.1" placeholder="250" value="${esc(draftVariant.carbs??'')}"></label><label class="field">脂肪 <small>g</small><input data-macro="fat" inputmode="decimal" type="number" min="0" step="0.1" placeholder="65" value="${esc(draftVariant.fat??'')}"></label></div></div><p class="note">保存日方案后会返回模板编辑页，弹层高度不会因页面内容变少而缩回底部；还需点击「保存营养模板」才会创建模板。</p>`;
    footer=btn('保存日方案','save-variant');
   }else if(screen==='manual'){
    title='手动设置当日目标';html=`${selectedDate()}<div class="section"><h3 class="sectiontitle">仅设置今天</h3><p class="sub">无需营养模板，直接填写需要的营养目标。</p><div class="fieldrow" style="margin-top:18px">${[['calories','热量','kcal'],['protein','蛋白质','g'],['carbs','碳水','g'],['fat','脂肪','g']].map(([key,n,u])=>`<label class="field">${n} <small>${u}</small><input type="number" data-manual="${key}" inputmode="decimal" min="0" step="0.1" value="${applied?.[key]??''}" placeholder="${key==='calories'?2200:key==='protein'?160:key==='carbs'?250:65}"></label>`).join('')}</div></div><div class="note">手动保存不会创建或启用模板，也不会改动实际饮食记录。</div>`;
    footer=btn('保存今天的目标','save-manual')
   }
   head.textContent=title;$('#back').hidden=!back;body.innerHTML=html;foot.innerHTML=footer+'<p class="alert" id="formError" role="alert" hidden></p>';body.scrollTop=0;head.focus({preventScroll:true});
   $('#keyboardDemo').hidden=!['editor','variantEditor','manual'].includes(screen);
 }
 function nav(s,{remember=true}={}){if(simKeyboard)setKeyboard(false);if(remember)stack.push(screen);screen=s;printScreen();}
 function goBack(){if(simKeyboard){setKeyboard(false);return}if(screen==='variantEditor'&&dirty&&hasVariantUnsaved()&&!confirm('放弃未保存的日方案更改？'))return;if(screen==='editor'&&hasUnsavedTemplate()&&!confirm('放弃未保存的模板草稿？'))return;const p=stack.pop();if(!p){closeSheet();return}screen=p;printScreen();if(screen==='editor')body.scrollTop=scrollMemory;}
 function openSheet(){screen='picker';stack=[];overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.classList.add('sheet-lock');document.documentElement.style.overflow='hidden';syncViewport();printScreen();}
 function hasUnsavedTemplate(){return !!draft&&(draft.name.trim()||draft.variants.length)}
 function hasVariantUnsaved(){return !!draftVariant&&(draftVariant.name.trim()||['calories','protein','carbs','fat'].some(k=>draftVariant[k]!==undefined))}
 function closeSheet(){if((screen==='editor'||screen==='variantEditor')&&hasUnsavedTemplate()&&!confirm('放弃未保存的营养模板草稿？'))return;setKeyboard(false);overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('sheet-lock');document.documentElement.style.overflow='';$('#openGoals').focus({preventScroll:true});}
 function error(s){let e=$('#formError');e.textContent=s;e.hidden=false;}
 function clearError(){const e=$('#formError');if(e)e.hidden=true;}
 function numeric(input,key,target){const val=input.value.trim();if(!val){delete target[key];return}const num=Number(val);if(Number.isFinite(num)&&num>=0)target[key]=num;else target[key]=NaN;}
 function syncViewport(){let vv=window.visualViewport, height=vv?.height??window.innerHeight,keyboard=Math.max(0,window.innerHeight-(height+(vv?.offsetTop??0)));if(simKeyboard)height=Math.min(height,window.innerHeight-290);document.documentElement.style.setProperty('--vvh',`${height}px`);document.documentElement.style.setProperty('--keyboard',`${Math.max(keyboard,simKeyboard?290:0)}px`);}
 function setKeyboard(on){simKeyboard=on;$('#simKeyboard').classList.toggle('on',on);$('#keyboardDemo').textContent=on?'关闭模拟键盘':'演示键盘';syncViewport();const e=document.activeElement;if(on&&e instanceof HTMLInputElement)requestAnimationFrame(()=>e.scrollIntoView({block:'nearest'}))}
 function updateHome(){if(applied){$('#homeGoalCaption').textContent=`今日目标 ${applied.calories??'—'} kcal`;$('#homeSource').textContent=`目标来源：${applied.templateName??'手动设置'}${applied.variantName?' · '+applied.variantName:''}。实际饮食记录没有改动。`;}else{$('#homeGoalCaption').textContent='尚未设置当日目标';$('#homeSource').textContent='已记录的饮食不会因设置营养目标而改变。'}$('#goalEntry').textContent=applied?'编辑目标':'设置目标';}
 function saveVariant(){const name=$('#variantName').value.trim();if(!name){error('请先填写方案名称。');return;}if(!['calories','protein','carbs','fat'].some(k=>Number.isFinite(draftVariant[k]))){error('请至少填写一项营养目标。');return;}if(['calories','protein','carbs','fat'].some(k=>draftVariant[k]!==undefined&&(!Number.isFinite(draftVariant[k])||draftVariant[k]<0))){error('请检查营养目标数值。');return}draftVariant.name=name;if(editingIndex===null)draft.variants.push({...draftVariant,id:'new-'+Math.random().toString(36).slice(2,10)});else draft.variants[editingIndex]={...draftVariant};dirty=false;if(simKeyboard)setKeyboard(false);screen='editor';stack.pop();printScreen();body.scrollTop=scrollMemory;notice('日方案已添加，请继续保存模板');}
 function saveTemplate(){draft.name=$('#templateName').value.trim();if(!draft.name){error('请填写模板名称。');return;}if(!draft.variants.length){error('请先添加至少一个日方案。');return;}const t={id:'new-template-'+Math.random().toString(36).slice(2,9),name:draft.name,active:false,variants:structuredClone(draft.variants)};templates.unshift(t);if(simKeyboard)setKeyboard(false);draft=null;stack=[];screen='picker';printScreen();notice('模板已保存；可立即选择启用');}
 function applyTarget(){applied={...chosenVariant,templateId:chosenTemplate.id,templateName:chosenTemplate.name,variantName:chosenVariant.name};updateHome();overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('sheet-lock');document.documentElement.style.overflow='';notice('今天的营养目标已应用');$('#openGoals').focus({preventScroll:true});}
 function saveManual(){let values={};for(const field of body.querySelectorAll('[data-manual]'))numeric(field,field.dataset.manual,values);if(!Object.keys(values).length){error('请至少填写一项营养目标。');return}if(Object.values(values).some(v=>!Number.isFinite(v))){error('请填写有效的目标数值。');return}applied={...values,templateName:'手动设置'};if(simKeyboard)setKeyboard(false);updateHome();overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('sheet-lock');document.documentElement.style.overflow='';notice('今天的手动目标已保存')}
 $('#openGoals').addEventListener('click',openSheet);
 $('#keyboardDemo').addEventListener('click',()=>setKeyboard(!simKeyboard));
 overlay.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;clearError();
  if(a==='close'){closeSheet();return}if(a==='back'){goBack();return}
  if(a==='choose-template'){chosenTemplate=templates.find(t=>t.id===b.dataset.id);chosenVariant=null;nav(chosenTemplate.active?'variants':'activate');return}
  if(a==='activate-template'){for(const template of templates)template.active=template.id===chosenTemplate.id;nav('variants');return}
  if(a==='choose-variant'){chosenVariant=chosenTemplate.variants.find(v=>v.id===b.dataset.id);nav('preview');return}
  if(a==='show-preview'){if(!chosenVariant){error('请选择日方案。');return}nav('preview');return}
  if(a==='apply-target'){applyTarget();return}
  if(a==='new-template'){draft={name:'',variants:[]};scrollMemory=0;nav('editor');return}
  if(a==='add-variant'||a==='edit-variant'){scrollMemory=body.scrollTop;editingIndex=a==='edit-variant'?Number(b.dataset.index):null;draftVariant=editingIndex===null?{name:''}:{...draft.variants[editingIndex]};dirty=false;nav('variantEditor');return}
  if(a==='save-variant'){saveVariant();return}
  if(a==='save-template'){saveTemplate();return}
  if(a==='manual'){nav('manual');return}
  if(a==='save-manual'){saveManual();return}
 });
 overlay.addEventListener('input',e=>{const t=e.target;if(t.id==='templateName'){draft.name=t.value;clearError()}else if(t.id==='variantName'){draftVariant.name=t.value;dirty=true;clearError()}else if(t.dataset.macro){numeric(t,t.dataset.macro,draftVariant);dirty=true;clearError()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open')){e.preventDefault();goBack()}});
 window.addEventListener('resize',syncViewport);window.visualViewport?.addEventListener('resize',syncViewport);window.visualViewport?.addEventListener('scroll',syncViewport);
 window.prototypeQA={get:()=>({screen,templates:structuredClone(templates),applied:structuredClone(applied),sheet:overlay.classList.contains('open')?{sheet:$('#sheet').getBoundingClientRect().toJSON(),head:$('.sheethead').getBoundingClientRect().toJSON(),body:body.getBoundingClientRect().toJSON(),foot:foot.getBoundingClientRect().toJSON()}:null}),simulateKeyboard:setKeyboard,reset:()=>location.reload()};
 updateHome();syncViewport();
})();
</script>
</body>
</html>
