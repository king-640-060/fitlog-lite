/* v0.3 · monthly title and today shortcut share one restrained toolbar */
.calendar-toolbar{margin:5px 0 12px}
.calendar-heading{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:46px;gap:0}

.calendar-today-inline:active{background:var(--accent-soft)}

.subgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0px 4px}
.sub-item{display:flex;align-items:center;text-align:left;gap:6px;width:100%;min-width:0;min-height:44px;border:0;border-radius:8px;background:transparent;padding:0 3px;color:var(--muted);font-size:12px;font-weight:450;line-height:1.35}

.task-editor-sub .field{min-height:44px;font-size:13px}

<div id="shell"><header class="top"><div><h1 id="page-title">进度</h1><p id="page-subtitle">看见每一次积累</p></div><div class="top-actions"><button class="icon-button" id="go-help" title="原型说明" aria-label="原型说明"><svg class="ico"><use href="#i-info"/></svg></button><button class="icon-button" id="go-settings" title="管理与外观" aria-label="管理与设置"><svg class="ico"><use href="#i-more"/></svg></button></div></header><div id="progress-tabs" class="tabs"></div><main id="view" aria-live="polite"></main><nav class="nav" id="nav"></nav></div><div id="overlay" hidden></div>
<script>
(()=>{
'use strict';
const I=(n,s='')=>`<svg class="ico ${s}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const $=(q,root=document)=>root.querySelector(q);const $$=(q,root=document)=>[...root.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const today='2026-10-12';
const navDefs=[['today','home','今日'],['plan','calendar','计划'],['food','utensils','饮食'],['workout','dumbbell','训练'],['progress','trend','进度']];
const state={view:'progress',progress:'calendar',theme:'system',year:2026,month:9,selected:today,habitDone:false,habitExists:true,taskExpanded:'',tasks:[{id:'t1',title:'打扫卫生',done:false,sub:[{id:'s1',title:'清理客厅',done:true},{id:'s2',title:'拖地',done:true},{id:'s3',title:'打扫厨房',done:false},{id:'s4',title:'清理卫生间',done:false}]},{id:'t2',title:'整理运动装备',done:false,sub:[{id:'s5',title:'把瑜伽垫擦干净并放回储物架',done:false},{id:'s6',title:'检查哑铃和弹力带是否完好',done:false},{id:'s7',title:'洗毛巾',done:false},{id:'s8',title:'把所有运动装备重新分类、清洁，再检查是否需要补充消耗品和洗涤用品',done:false}]}],trendKind:'weight',trendRange:30,trendSelected:2,historyKind:'weight',historyRange:30,historyCount:6,openedGroups:new Set(['2026-10-12']),reportMode:'cycle',cycleId:'c1',dietSelected:new Set(),lastNotice:''};
const dataRecords={weight:[{id:'w1',date:'2026-10-12',value:'111 kg',detail:'09:20 记录体重'},{id:'w2',date:'2026-10-09',value:'111.6 kg',detail:'07:40 记录体重'},{id:'w3',date:'2026-10-06',value:'112 kg',detail:'08:05 记录体重'},...Array.from({length:21},(_,i)=>({id:`w-old-${i}`,date:`2026-09-${String(30-i).padStart(2,'0')}`,value:(112+(i%6)*.2).toFixed(1)+' kg',detail:'08:00 记录体重'}))],sleep:[{id:'z1',date:'2026-10-11',value:'7小时35分钟',detail:'10/11 23:15 – 10/12 06:50'},{id:'z2',date:'2026-10-11',value:'25分钟',detail:'10/11 14:00 – 14:25'},{id:'z3',date:'2026-10-10',value:'8小时10分钟',detail:'10/10 22:30 – 10/11 06:40'},...Array.from({length:18},(_,i)=>({id:`z-old-${i}`,date:`2026-09-${String(30-i).padStart(2,'0')}`,value:'7小时20分钟',detail:'23:00 – 次日06:20'}))],water:[{id:'h1',date:'2026-10-12',value:'250 ml',detail:'09:25'},{id:'h2',date:'2026-10-12',value:'300 ml',detail:'08:10'},{id:'h3',date:'2026-10-11',value:'200 ml',detail:'19:35'},...Array.from({length:24},(_,i)=>({id:`h-old-${i}`,date:`2026-09-${String(30-i).padStart(2,'0')}`,value:`${200+(i%3)*50} ml`,detail:'12:30'}))]};
let editorDraft=null;let dialogClose=()=>{};
const titles={today:['今日','你的记录与计划'],plan:['计划','按目标安排每一天'],food:['饮食','实际饮食记录与营养目标'],workout:['训练','训练管理与实际记录'],progress:['进度','看见每一次积累']};
const pref=window.matchMedia?.('(prefers-color-scheme: dark)');
function applyTheme(){const dark=state.theme==='dark'||state.theme==='system'&&pref?.matches;document.documentElement.dataset.effectiveTheme=dark?'dark':'light';$('meta[name="theme-color"]').content=dark?'#171c19':'#f4f2e9'}
pref?.addEventListener?.('change',()=>{if(state.theme==='system'){applyTheme();render()}});
function navigate(view,tab){state.view=view;if(tab)state.progress=tab;render();window.scrollTo({top:0,behavior:'instant'})}
function banner(){return `<div class="preview-note">${I('info','sm')} 可点击演示 · 虚构数据 · 不连接真实记录或 GitHub</div>`}
function render(){applyTheme();$('#page-title').textContent=titles[state.view][0];$('#page-subtitle').textContent=titles[state.view][1];$('#progress-tabs').style.display=state.view==='progress'?'grid':'none';$('#progress-tabs').innerHTML=['trend','calendar','report'].map((t,i)=>`<button type="button" data-progress="${t}" class="${state.progress===t?'active':''}">${['趋势','日历','报告'][i]}</button>`).join('');$('#nav').innerHTML=navDefs.map(([key,ic,title])=>`<button data-nav="${key}" class="${state.view===key?'active':''}" aria-current="${state.view===key?'page':'false'}">${I(ic)}<span>${title}</span></button>`).join('');const v=state.view==='progress'?(state.progress==='calendar'?calendarView():state.progress==='trend'?trendView():reportView()):state.view==='today'?todayView():state.view==='plan'?planView():state.view==='food'?foodView():workoutView();$('#view').innerHTML=`<div class="screen">${banner()}${v}</div>`;bindMain()}
function calendarMarks(d){let a=[];if(d===12)a=['scale','water','calendar','check','utensils'];if(d===11)a=['moon','dumbbell','flame'];if(d===9)a=['scale','water','stairs'];if(d===6)a=['leaf','check'];if(d===16)a=['calendar'];return a}
const markColor={scale:'var(--weight)',water:'var(--accent)',calendar:'var(--accent)',check:'var(--accent)',utensils:'var(--accent)',moon:'var(--accent)',dumbbell:'var(--workout)',flame:'var(--pelvic)',stairs:'var(--pelvic)',leaf:'var(--pelvic)'};
function calendarView(){const y=state.year,m=state.month;const prefix=new Date(y,m,1).getDay(),offset=(prefix+6)%7;const num=new Date(y,m+1,0).getDate();const past=new Date(y,m,0).getDate();const days=Array.from({length:42},(_,i)=>{const j=i-offset+1;let n=j,mo=m,yy=y,out=false;if(j<1){n=past+j;mo--;out=true}else if(j>num){n=j-num;mo++;out=true}const dt=new Date(yy,mo,n);const date=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;const marks=mo===m?calendarMarks(n):[];return `<button type="button" class="day-cell ${out?'outside':''} ${date===state.selected?'selected':''} ${date===today?'current':''}" data-day="${date}" aria-label="${date}, ${marks.length} 类记录"><span class="day-num">${n}</span><span class="day-markers">${marks.map(s=>`<i style="color:${markColor[s]}">${I(s,'xs')}</i>`).join('')}</span></button>`});return `<div class="calendar-toolbar"><div class="calendar-heading"><button class="icon-button month-arrow" id="month-prev" aria-label="上个月">${I('chevron-left','lg')}</button><div class="calendar-heading-center"><strong class="calendar-month-equal">${y}年 ${m+1}月</strong><button type="button" class="calendar-today-equal" id="back-to-today" aria-label="回到今天" title="回到今天">今天</button></div><button class="icon-button month-arrow" id="month-next" aria-label="下个月">${I('chevron-right','lg')}</button></div></div><div class="calendar-card"><div class="calendar-grid">${['一','二','三','四','五','六','日'].map(d=>`<div class="weekday">${d}</div>`).join('')}${days.join('')}</div></div><div class="legend">${[['utensils','饮食'],['dumbbell','力量'],['stairs','有氧'],['leaf','凯格尔'],['scale','体重'],['flame','特殊饮食'],['check','习惯'],['moon','睡眠'],['water','饮水'],['calendar','计划']].map(([ic,n])=>`<span>${I(ic,'xs')}${n}</span>`).join('')}</div><p class="subtle">月份水平居中；「今天」为右侧低强调文字入口，不占额外行或大面积按钮。日期图标最多 10 类，当前仅点亮有数据的类别。</p>`}
function isLongSubtask(title){return [...title].reduce((units,ch)=>units+(/[\u2e80-\u9fff\uf900-\ufaff]/u.test(ch)?1:0.52),0)>7}
function taskCard(t){const done=t.sub.filter(s=>s.done).length,open=state.taskExpanded===t.id;return `<article class="card task-card" data-task="${esc(t.id)}"><div class="task-header"><button type="button" class="task-check" aria-pressed="${t.done}" aria-label="${t.done?'取消完成':'完成'}主任务 ${esc(t.title)}" data-toggle-task="${t.id}"><span class="check-ring">${I('check','sm')}</span></button><button class="task-title" data-edit-task="${t.id}"><strong class="${t.done?'done-text':''}">${esc(t.title)}</strong><span class="subtle">${t.sub.length?`子任务 ${done}/${t.sub.length} · 主任务独立完成`:'无子任务 · 点击编辑'}</span></button><button class="task-open" data-expand-task="${t.id}" aria-label="${open?'收起':'展开'}子任务" aria-expanded="${open}" ${t.sub.length?'':'disabled'}>${t.sub.length?I(open?'chevron-up':'chevron-down'):''}</button></div>${open&&t.sub.length?`<div class="sublist"><div class="sublist-heading"><span>子任务清单</span><button class="sublist-edit" data-edit-task="${t.id}">${I('edit','xs')} 编辑</button></div><div class="subgrid">${t.sub.map(s=>`<button type="button" class="sub-item ${isLongSubtask(s.title)?'sub-item-long':''}" data-toggle-sub="${t.id}/${s.id}" aria-pressed="${s.done}" aria-label="${s.done?'取消完成':'完成'}子任务 ${esc(s.title)}"><span class="sub-dot">${s.done?I('check','xs'):''}</span><span class="sub-name ${s.done?'done-text':''}">${esc(s.title)}</span></button>`).join('')}</div></div>`:''}</article>`}
function planView(){return `<div class="split" style="margin-bottom:14px"><strong>今日任务 · 10月12日</strong><button class="text-btn" data-new-task>${I('plus','sm')} 新建任务</button></div>${state.tasks.map(taskCard).join('')}<p class="subtle">短子任务两列，长子任务自动独占一行并最多预览两行，完整内容可在编辑页查看；子任务全部完成后，主任务仍需手动勾选。</p>`}
function habitSection(){if(!state.habitExists)return `<div class="card"><strong>习惯</strong><p class="muted">还没有习惯</p><button class="text-btn" data-reset-habit>恢复演示习惯</button></div>`;return `<section class="card habit-card"><div class="card-head"><div class="row"><span class="icon-chip">${I('check')}</span><strong>习惯</strong></div><button class="text-btn" id="habit-manage">管理 ${I('chevron-right','sm')}</button></div><div class="habit-row"><button type="button" class="habit-check" data-habit-check aria-label="${state.habitDone?'取消打卡':'完成打卡'}每日拉伸" aria-pressed="${state.habitDone}"><span class="check-ring">${I('check','sm')}</span></button><button type="button" class="habit-details" data-habit-detail><strong>每日拉伸</strong><small>点击文字只打开习惯详情，不会打卡</small></button>${I('chevron-right','sm')}</div><p class="subtle">${state.habitDone?'已打卡 1 项':'尚未打卡'} · 仅左侧 44px 勾选区域可切换状态</p></section>`}
function todayView(){return `<section class="card"><div class="card-head"><div class="row"><span class="icon-chip">${I('calendar')}</span><h2>今日计划</h2></div><button class="text-btn" data-nav-inline="plan">查看计划 ${I('chevron-right','sm')}</button></div>${state.tasks.slice(0,1).map(t=>`<div class="split"><span>${esc(t.title)} · ${t.sub.filter(s=>s.done).length}/${t.sub.length} 子任务</span><span class="pill">${t.done?'已完成':'进行中'}</span></div>`).join('')}</section><section class="card"><div class="card-head"><div class="row"><span class="icon-chip workout">${I('dumbbell')}</span><h2>训练</h2></div></div><div class="split"><span>力量训练</span><button class="secondary" data-nav-inline="workout">记录训练</button></div></section><section class="card"><div class="card-head"><div class="row"><span class="icon-chip weight">${I('scale')}</span><h2>体重</h2></div><button class="text-btn" data-trend-kind="weight">查看趋势</button></div><div class="split"><strong>111 kg</strong><small class="muted">演示数据 · 10/12</small></div></section>${habitSection()}`}
function workoutView(){return `<section class="card"><div class="card-head"><div class="row"><span class="icon-chip workout">${I('dumbbell')}</span><h2>力量训练</h2></div></div><p class="muted">演示：深色模式已统一图标背景与文字颜色。</p></section><section class="card"><div class="card-head"><div class="row"><span class="icon-chip weight">${I('scale')}</span><h2>体重</h2></div></div><p class="muted">复用主题 Token，不使用固定浅色图标底色。</p></section><div class="card"><strong>从这里测试三个趋势图</strong><div class="ranges">${['weight','sleep','water'].map(k=>`<button data-trend-kind="${k}">${({weight:'体重',sleep:'睡眠',water:'饮水'})[k]}</button>`).join('')}</div></div>`}
function trendSets(kind){if(kind==='weight')return [{date:'10/06',value:112},{date:'10/09',value:111.6},{date:'10/12',value:111}];if(kind==='sleep')return [{date:'10/08',value:7.25},{date:'10/10',value:8.1},{date:'10/11',value:7.58}];return [{date:'10/10',value:600},{date:'10/11',value:500},{date:'10/12',value:550}]}
function trendChart(kind){const points=trendSets(kind);const selected=clamp(state.trendSelected,0,points.length-1);const vals=points.map(x=>x.value),max=Math.max(...vals),min=Math.min(...vals),gap=max-min||1;const xy=vals.map((v,i)=>({x:38+i*110,y:118-(v-min)/gap*75}));const p=xy[selected];return `<div class="chart"><div class="chart-label"><strong>${({weight:'体重',sleep:'睡眠',water:'饮水'})[kind]}实际记录</strong><span>${points.length} 天有记录</span></div><svg class="chart-svg" viewBox="0 0 320 160" role="group" aria-label="${kind}图表，选择日期查看数据">${[25,65,118].map(y=>`<line class="gridline" x1="22" y1="${y}" x2="310" y2="${y}"/>`).join('')}<line class="guide" x1="${p.x}" x2="${p.x}" y1="20" y2="125"/><polyline class="pathline" points="${xy.map(p=>`${p.x},${p.y}`).join(' ')}"/>${xy.map((pt,i)=>`<g role="button" tabindex="0" data-plot="${i}" aria-label="${points[i].date} ${points[i].value}"><circle class="dot ${i===selected?'selected':''}" cx="${pt.x}" cy="${pt.y}" r="${i===selected?7:4}"/><circle class="dot-hit" cx="${pt.x}" cy="${pt.y}" r="21"/><text x="${pt.x}" y="146" text-anchor="middle">${points[i].date}</text></g>`).join('')}</svg></div>`}
function trendView(){const k=state.trendKind,point=trendSets(k)[clamp(state.trendSelected,0,2)],v=k==='weight'?`${point.value} kg`:k==='sleep'?`${point.value.toFixed(1)} 小时`:`${point.value} ml`;return `<div class="ranges" style="margin:0 0 14px">${[['weight','体重'],['sleep','睡眠'],['water','饮水']].map(([key,n])=>`<button data-trend-kind="${key}" class="${k===key?'active':''}">${n}</button>`).join('')}</div><section class="card trend-overview"><div class="trend-header"><div class="row"><span class="icon-chip ${k==='weight'?'weight':''}">${I(k==='weight'?'scale':k==='sleep'?'moon':'water')}</span><h2>${({weight:'体重',sleep:'睡眠',water:'饮水'})[k]}</h2></div><button class="text-btn" data-open-history="${k}">历史记录 ${I('chevron-right','sm')}</button></div><div><div class="trend-value">${v}</div><span class="muted">2026年${point.date.replace('/','月')}日</span></div>${trendChart(k)}<div class="ranges">${[7,30,90].map(n=>`<button data-chart-range="${n}" class="${n===state.trendRange?'active':''}">${n}天</button>`).join('')}</div><p class="chart-help">三个趋势均使用同样的选中圆点、外环、日期虚线和数值反馈。此处切换范围为原型演示。</p></section><section class="card"><strong>管理大量历史记录</strong><p class="muted" style="font-size:13px;margin:7px 0">日期分组、单条编辑删除、每次分批显示。数据不会因折叠或分页而丢失。</p><button class="secondary" style="width:100%" data-open-history="${k}">查看历史管理原型</button></section>`}

;render();notice('任务已保存（仅演示）')}})}

function historySheet(){const kind=state.historyKind,all=dataRecords[kind],start=new Date(today+'T12:00:00');start.setDate(start.getDate()-state.historyRange+1);const firstDate=`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`,filtered=all.filter(r=>r.date>=firstDate&&r.date<=today),shown=filtered.slice(0,state.historyCount),groups=new Map();shown.forEach(r=>{const v=groups.get(r.date)||[];v.push(r);groups.set(r.date,v)});const title={weight:'体重',sleep:'睡眠',water:'饮水'}[kind];openSheet(`${title}历史记录`,`<div class="history-filter"><select id="history-kind"><option value="weight" ${kind==='weight'?'selected':''}>体重</option><option value="sleep" ${kind==='sleep'?'selected':''}>睡眠</option><option value="water" ${kind==='water'?'selected':''}>饮水</option></select><select id="history-range"><option value="7" ${state.historyRange===7?'selected':''}>最近 7 天</option><option value="30" ${state.historyRange===30?'selected':''}>最近 30 天</option><option value="90" ${state.historyRange===90?'selected':''}>最近 90 天</option></select></div><p class="subtle">按日期折叠 · 编辑或删除精确记录。当前已加载 ${shown.length}/${filtered.length} 条范围内演示记录。</p>${[...groups].map(([date,rows])=>`<section class="history-group"><button type="button" data-history-group="${date}"><strong>${date}</strong><span class="subtle">${rows.length} 条 ${I(state.openedGroups.has(date)?'chevron-up':'chevron-down','sm')}</span></button>${state.openedGroups.has(date)?rows.map(r=>`<div class="history-row"><div><strong>${esc(r.value)}</strong><span class="subtle">${esc(r.detail)}</span></div><div class="history-actions"><button data-edit-hist="${r.id}" aria-label="编辑${esc(r.value)}">${I('edit','sm')}</button><button data-delete-hist="${r.id}" aria-label="删除${esc(r.value)}" class="danger-text">${I('trash','sm')}</button></div></div>`).join(''):''}</section>`).join('')}${shown.length<filtered.length?`<button class="secondary history-more" id="history-more">加载更早记录（下 6 条）</button>`:'<p class="subtle">已加载全部演示记录。</p>'}`,o=>{$('#history-kind').onchange=e=>{state.historyKind=e.target.value;state.historyCount=6;state.openedGroups=new Set(['2026-10-12']);historySheet()};$('#history-range').onchange=e=>{state.historyRange=Number(e.target.value);state.historyCount=6;historySheet()};$$('[data-history-group]',o).forEach(b=>b.onclick=()=>{const d=b.dataset.historyGroup;if(state.openedGroups.has(d))state.openedGroups.delete(d);else state.openedGroups.add(d);historySheet()});$$('[data-edit-hist]',o).forEach(b=>b.onclick=()=>{const r=dataRecords[state.historyKind].find(x=>x.id===b.dataset.editHist);openSheet('编辑历史记录',`<label class="field-label">当前记录</label><input class="field" value="${esc(r.value)}" id="history-edit-value"><p class="subtle">仅演示编辑，不修改真实健康数据。</p><button class="primary sheet-button" id="history-save">保存</button>`,()=>{$('#history-save').onclick=()=>{r.value=$('#history-edit-value').value;historySheet();notice('记录已修改（演示）')}})});$$('[data-delete-hist]',o).forEach(b=>b.onclick=()=>{const arr=dataRecords[state.historyKind],i=arr.findIndex(x=>x.id===b.dataset.deleteHist),r=arr[i];confirmDialog('删除这条记录？',`只删除 ${r.date} 的「${r.value}」记录。其他日期与记录不受影响。`,'永久删除',()=>{arr.splice(i,1);historySheet();notice('已删除演示记录')})});$('#history-more')?.addEventListener('click',()=>{state.historyCount+=6;historySheet()})})}
function designatedFoodSheet(){const foods=[['米饭','130 kcal / 100g'],['鸡胸肉','165 kcal / 100g'],['鸡蛋','143 kcal / 100g'],['牛奶','63 kcal / 100g']];openSheet('指定食物',`<p class="subtle">智能推荐已移除。手动指定真实食物；这里只预览选择，不写入摄入记录。</p><input type="search" class="field" id="food-search" placeholder="搜索食物名称"><div id="food-choices">${foods.map(([n,d],i)=>`<label class="choice-row" style="cursor:pointer"><span><strong>${n}</strong><br><small class="muted">${d}</small></span><input type="checkbox" name="food" value="${i}" ${state.dietSelected.has(i)?'checked':''}></label>`).join('')}</div><p class="subtle" id="food-count">已选择 ${state.dietSelected.size} 项</p><button class="primary sheet-button" id="food-preview">预览所选食物</button>`,o=>{$$('#food-choices input',o).forEach(b=>b.onchange=()=>{const n=Number(b.value);if(b.checked)state.dietSelected.add(n);else state.dietSelected.delete(n);$('#food-count').textContent=`已选择 ${state.dietSelected.size} 项`});$('#food-search').oninput=e=>{const q=e.target.value.trim();$$('.choice-row',o).forEach(b=>{b.style.display=b.innerText.includes(q)?'grid':'none'})};$('#food-preview').onclick=()=>{if(!state.dietSelected.size){notice('请先选择食物');return}closeOverlay();notice(`已选 ${state.dietSelected.size} 种食物（演示，未记账）`)}})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeOverlay()});
render();
})();
</script>
</body>
