<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>FitLog Lite · 日历十类记录及折叠操作 · 原型 v0.1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-synthesis:none;color-scheme:dark;--bg:#151b17;--surface:#222b25;--soft:#2a362e;--line:#39483d;--text:#eff2ed;--secondary:#aab5ab;--tertiary:#93a095;--accent:#b3d487;--accent-bg:#30432a;--danger:#e2a99d;--food:#a8cc80;--strength:#99c4bd;--cardio:#d6bb80;--pelvic:#a8c6b3;--weight:#b4c9d5;--special:#d6aa88;--habit:#b8ca8b;--sleep:#b4bca5;--water:#93c6ca;--plan:#d0cb92}
:root[data-theme="light"]{color-scheme:light;--bg:#f5f2eb;--surface:#fffefa;--soft:#f8f8f2;--line:#e9e8df;--text:#282e28;--secondary:#697369;--tertiary:#758075;--accent:#52723b;--accent-bg:#e9f0dc;--danger:#a65840;--food:#52723b;--strength:#426d67;--cardio:#946e2c;--pelvic:#6f98a3;--weight:#5f7480;--special:#a3755a;--habit:#64864a;--sleep:#738456;--water:#6192a0;--plan:#7c7639}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{max-width:520px;margin:auto;min-height:100dvh;padding:24px 16px 105px}.top{display:flex;align-items:flex-start;justify-content:space-between;margin:7px 2px 23px}.title{font-size:30px;font-weight:750;line-height:1.2}.sub{font-size:13px;color:var(--secondary);margin-top:8px}.theme{min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--secondary);padding:0 12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:19px;border-bottom:1px solid var(--line)}.tabs button{height:49px;background:none;border:0;color:var(--secondary)}.tabs button.active{color:var(--accent);border-bottom:3px solid var(--accent);font-weight:750}.navmonth{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:16px 0}.navmonth b{text-align:center;font-size:19px;letter-spacing:.01em}.navmonth button{height:44px;border:0;background:none;color:var(--accent);font-size:28px}.calendar{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:11px 6px 13px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{margin-bottom:7px}.week span{text-align:center;font-size:12px;font-weight:600;color:var(--secondary)}.day{padding:4px 0 5px;border:1px solid transparent;background:transparent;color:var(--text);min-width:0;min-height:102px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}.day.other{opacity:.30}.day .num{display:grid;place-items:center;min-height:32px;width:32px;border-radius:50%;font-size:14px;font-weight:650}.day.active .num{background:var(--accent-bg);color:var(--accent)}.day.today .num:after{content:'';width:4px;height:4px;border-radius:100%;background:var(--accent);position:absolute;margin-top:28px}.marks{width:40px;display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(4,11px);column-gap:2px;row-gap:2px;justify-content:center}.mark{display:grid;place-items:center;width:12px;height:11px}.mark .svg{width:11px;height:11px;stroke-width:2.1}.legend{display:flex;flex-wrap:wrap;gap:11px 13px;justify-content:center;padding:19px 4px 0}.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--secondary)}.legend .svg{width:16px;height:16px}.hint{font-size:11px;text-align:center;color:var(--tertiary);line-height:1.7;margin:14px 0 0}.bottom-nav{position:fixed;z-index:2;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:88px;border:1px solid var(--line);border-radius:21px 21px 0 0;background:var(--surface);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:11px 5px 16px}.bottom-nav span{text-align:center;font-size:12px;color:var(--secondary);padding:11px 0}.bottom-nav span:last-child{border-radius:13px;color:var(--accent);background:var(--accent-bg);font-weight:750}.overlay{position:fixed;inset:0;z-index:5;background:#0008;display:none;align-items:flex-end;justify-content:center}.overlay.visible{display:flex}.sheet{background:var(--surface);color:var(--text);width:min(100%,520px);max-height:91dvh;overflow-y:auto;border-radius:25px 25px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain}.handle{height:5px;width:39px;border-radius:6px;background:var(--line);margin:0 auto 17px}.sheet-head{display:flex;justify-content:space-between;align-items:center;min-height:51px;margin-bottom:10px}.sheet-head strong{font-size:19px}.close{height:44px;width:44px;border:0;background:transparent;color:var(--secondary);font-size:28px}.section-title{font-weight:750;font-size:15px;margin:21px 0 12px}.section-help{font-size:12px;color:var(--secondary);margin:-4px 0 14px;line-height:1.5}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fact{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:13px;background:var(--soft);padding:10px 9px;min-height:67px}.fact .svg{width:20px;height:20px;grid-row:span 2}.fact b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fact small{font-size:12px;color:var(--secondary);white-space:nowrap}.fact.highlight{border-color:var(--accent)}.fact-detail{border:1px solid var(--line);padding:12px 14px;border-radius:13px;margin-top:9px;color:var(--secondary);font-size:13px;line-height:1.65}.accordions{display:grid;gap:9px;margin-top:22px}.acc{border:1px solid var(--line);border-radius:15px;overflow:hidden}.acc>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:9px 13px;cursor:pointer}.acc>summary::-webkit-details-marker{display:none}.acc>summary span{display:grid;gap:3px}.acc>summary b{font-size:14px}.acc>summary small{font-size:11px;color:var(--secondary)}.acc>summary:after{content:'⌄';font-size:23px;color:var(--secondary)}.acc[open]>summary:after{transform:rotate(180deg)}.acc-body{border-top:1px solid var(--line);padding:13px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick{min-height:44px;text-align:left;padding:9px;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:12px;display:flex;align-items:center;gap:7px;font-size:12px}.quick .svg{width:17px;height:17px}.delete-label{font-size:12px;color:var(--secondary);line-height:1.55;margin-bottom:12px}.delete-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.delete-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:10px 8px;min-height:49px;font-size:12px}.delete-row input{accent-color:var(--accent);width:17px;height:17px;margin:0}.delete-row:has(input:disabled){opacity:.5}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px}.linkbutton{border:0;background:none;color:var(--accent);padding:10px 2px;min-height:44px;font-size:12px}.danger{min-height:44px;padding:7px 14px;border:1px solid var(--line);background:transparent;color:var(--danger);border-radius:12px;font-size:13px}.danger:disabled{opacity:.45}.footnote{margin-top:17px;color:var(--secondary);line-height:1.6;font-size:11px}.toast{position:fixed;z-index:20;left:50%;bottom:104px;transform:translateX(-50%);max-width:calc(100% - 25px);background:var(--text);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:12px;text-align:center;display:none}.confirm-panel{padding:12px 0 6px}.confirm-panel h3{font-size:18px;margin:2px 0 12px}.confirm-panel p{font-size:13px;color:var(--secondary);line-height:1.7}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.confirm-actions button{min-height:45px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--text)}.confirm-actions button:last-child{color:var(--danger)}
:root .cat-food{color:var(--food)}:root .cat-strength{color:var(--strength)}:root .cat-cardio{color:var(--cardio)}:root .cat-pelvic{color:var(--pelvic)}:root .cat-weight{color:var(--weight)}:root .cat-special{color:var(--special)}:root .cat-habit{color:var(--habit)}:root .cat-sleep{color:var(--sleep)}:root .cat-water{color:var(--water)}:root .cat-plan{color:var(--plan)}
@media(max-width:355px){.app{padding:18px 4px 96px}.top{padding:0 10px}.calendar{padding:10px 1px 10px}.days{gap:0}.day{border-radius:9px}.week{padding:0}.legend{gap:8px 10px}.sheet{padding-left:12px;padding-right:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="title">进度</div><div class="sub">看见每一次积累</div></div><button id="theme" class="theme" type="button">切换浅色</button></div>
  <div class="tabs" role="tablist"><button type="button">趋势</button><button class="active" type="button">日历</button><button type="button">报告</button></div>
  <div class="navmonth"><button id="prev" aria-label="上个月">‹</button><b id="month-title">2026年10月</b><button id="next" aria-label="下个月">›</button></div>
  <section class="calendar" aria-label="十类记录日历"><div id="week" class="week"></div><div id="days" class="days"></div></section>
  <div id="legend" class="legend"></div>
  <p class="hint">仅有对应数据时点亮图标。计划表示有日程，不代表已完成。<br/>点击日期打开详情；这是一份独立演示原型，不使用真实数据。</p>
</div>
<div class="bottom-nav" aria-hidden="true"><span>今日</span><span>计划</span><span>饮食</span><span>训练</span><span>进度</span></div>
<div id="overlay" class="overlay" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="handle"></div><div class="sheet-head"><strong id="sheet-title">10月11日 · 星期日</strong><button class="close" id="close" aria-label="关闭">×</button></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const glyphs={food:'<path d="M4 2v7M7 2v7M10 2v7M4 6h6M7 9v13M17 2v20M17 2c-5 3-5 9 0 11"/>',strength:'<path d="m3 9 6-6 3 3-6 6M12 18l6-6 3 3-6 6M7 7l10 10M2 12l4 4M18 8l4 4"/>',cardio:'<path d="M3 19h5v-5h5V9h5V4h3"/>',pelvic:'<path d="M20 4c-9 0-15 3-15 11 0 3 2 5 5 5 8 0 11-9 10-16ZM6 19c1-5 5-9 11-12"/>',weight:'<path d="M3 9h18M12 4v14M7 9l-4 7h8L7 9Zm10 0-4 7h8l-4-7ZM5 21h14"/>',special:'<path d="M12 22c5 0 8-4 8-8 0-4-3-7-5-9 0 4-2 5-3 6-1-3-2-5-3-7C8 8 4 11 4 15c0 4 3 7 8 7Z"/>',habit:'<path d="m4 12 5 5L20 6"/>',sleep:'<path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/>',water:'<path d="M12 2c-3 4-7 9-7 13a7 7 0 0 0 14 0c0-4-4-9-7-13Z"/>',plan:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4M17 2v4M3 9h18m-13 6 2.5 2.5L16 12"/>'};
const cats=[['food','饮食'],['strength','力量训练'],['cardio','有氧训练'],['pelvic','凯格尔训练'],['weight','体重'],['special','特殊饮食'],['habit','习惯'],['sleep','睡眠'],['water','饮水'],['plan','计划']];
const icon=(key)=>`<svg class="svg cat-${key}" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${glyphs[key]}</svg>`;
const seed={'2026-10-10':{strength:1,weight:1,water:1},'2026-10-11':{food:2,strength:1,cardio:1,pelvic:1,weight:1,special:1,habit:2,sleep:1,water:1,plan:3},'2026-10-15':{plan:2,food:1},'2026-10-18':{food:2,habit:1,plan:1},'2026-10-24':{strength:1,water:2,plan:1}};
let records=structuredClone(seed);let year=2026,month=9,day='2026-10-11',detail=null,selected=new Set(),pendingDelete=null;
const pad=n=>String(n).padStart(2,'0'),ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`,weekday=['日','一','二','三','四','五','六'];
const $=id=>document.getElementById(id),tone=()=>document.documentElement.dataset.theme;
function renderCalendar(){ $('month-title').textContent=`${year}年${month+1}月`; $('week').innerHTML=['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('');
 const first=new Date(year,month,1);const start=(first.getDay()+6)%7;const total=new Date(year,month+1,0).getDate();const cells=Math.ceil((start+total)/7)*7;
 let html='';for(let i=0;i<cells;i++){const date=new Date(year,month,1-start+i),key=ymd(date.getFullYear(),date.getMonth(),date.getDate()),rec=records[key]||{};
 const slots=cats.map(([k])=>`<span class="mark" title="${rec[k]?cats.find(c=>c[0]===k)[1]:''}">${rec[k]?icon(k):''}</span>`);slots.splice(9,0,'<span class="mark"></span>');slots.push('<span class="mark"></span>');
 html+=`<button type="button" class="day ${date.getMonth()!==month?'other':''} ${day===key?'active':''} ${key==='2026-10-11'?'today':''}" data-date="${key}" aria-label="${date.getMonth()+1}月${date.getDate()}日，${cats.filter(c=>rec[c[0]]).map(c=>c[1]).join('、')||'无记录'}"><span class="num">${date.getDate()}</span><span class="marks">${slots.join('')}</span></button>`;
 }$('days').innerHTML=html;$('days').querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{day=b.dataset.date;let d=new Date(day+'T12:00:00');year=d.getFullYear();month=d.getMonth();renderCalendar();openSheet()}));
 $('legend').innerHTML=cats.map(([k,label])=>`<span>${icon(k)}${label}</span>`).join('');}
function titleDate(key){const date=new Date(key+'T12:00:00');return `${date.getMonth()+1}月${date.getDate()}日 · 星期${weekday[date.getDay()]}`}
function openSheet(){detail=null;selected.clear();pendingDelete=null;renderSheet();$('overlay').classList.add('visible');$('overlay').setAttribute('aria-hidden','false');document.querySelector('.sheet').scrollTop=0;$('close').focus()}
function closeSheet(){$('overlay').classList.remove('visible');$('overlay').setAttribute('aria-hidden','true');pendingDelete=null}
function renderSheet({keepScroll=false}={}){const scroll=document.querySelector('.sheet').scrollTop;
 $('sheet-title').textContent=titleDate(day);const r=records[day]||{};const num=cats.filter(([k])=>(r[k]||0)>0).length;
 const tiles=cats.map(([k,label])=>`<button type="button" class="fact ${detail===k?'highlight':''}" data-detail="${k}" aria-label="查看${label}记录">${icon(k)}<b>${label}</b><small>${r[k]?k==='plan'?`${r[k]}项计划`:`${r[k]}条记录`:'未记录'}</small></button>`).join('');
 let html=`<div class="section-title">当天记录 <small style="font-weight:400;color:var(--secondary);font-size:12px">${num} / 10 类有内容</small></div><p class="section-help">十类概览压缩成两列；点击类别查看说明。</p><div class="facts">${tiles}</div>`;
 if(detail){const label=cats.find(x=>x[0]===detail)[1];let a=detail==='plan'?'有计划事项不代表任务已完成。':detail==='sleep'?'睡眠按归属夜晚呈现，不按当天零点切断。':'这里只展示实际记录的示意数量，不包含模板或未发生的事实。';html+=`<div class="fact-detail"><b>${label}</b> · ${r[detail]||0} ${detail==='plan'?'项':'条'}<br/>${a}</div>`}
 html+=`<div class="accordions"><details class="acc" id="quick-acc"><summary><span><b>＋ 快捷记录</b><small>展开后选择需要记录的类别</small></span></summary><div class="acc-body"><div class="quick-grid">${cats.map(([k,label])=>`<button type="button" class="quick" data-add="${k}">${icon(k)}${label}</button>`).join('')}</div><p class="footnote">演示新增只增加数字，不会打开正式业务表单；实际应用沿用各类既有记录流程。</p></div></details>
 <details class="acc" id="manage-acc"><summary><span><b>管理 / 删除当天记录</b><small>独立选择 10 类，先预览再确认</small></span></summary><div class="acc-body"><div class="delete-label">只影响 ${day} 的指定类别，其他日期和模板保留。没有数据的类别不可勾选。计划属于独立的日期事项，和实际记录分开处理。</div><div class="delete-list">${cats.map(([k,label])=>`<label class="delete-row"><input type="checkbox" data-remove="${k}" ${(r[k]||0)>0?'':'disabled'} ${selected.has(k)?'checked':''}/>${label} <span style="margin-left:auto;color:var(--secondary)">${r[k]||0}</span></label>`).join('')}</div><div class="actions"><button class="linkbutton" id="select-all" type="button">选择全部有记录的类别</button><button class="danger" id="delete-selected" ${selected.size?'':'disabled'} type="button">删除 ${selected.size} 类</button></div><p class="footnote">实际删除需二次确认并由事务保证一致性。营养目标不属于这十类记录，是否随饮食清除应另行明确，不能隐式删除。</p></div></details></div>`;
 $('sheet-body').innerHTML=html;
 $('sheet-body').querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>{detail=detail===b.dataset.detail?null:b.dataset.detail;let expanded=[...document.querySelectorAll('.acc[open]')].map(el=>el.id);renderSheet({keepScroll:true});expanded.forEach(id=>$(id).open=true)}));
 $('sheet-body').querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.add;records[day]??={};records[day][k]=(records[day][k]||0)+1;renderCalendar();renderSheet({keepScroll:true});$('quick-acc').open=true;notice('原型演示：已新增一项「'+cats.find(x=>x[0]===k)[1]+'」')}));
 $('sheet-body').querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('change',()=>{if(b.checked)selected.add(b.dataset.remove);else selected.delete(b.dataset.remove);const button=$('delete-selected');button.disabled=!selected.size;button.textContent=`删除 ${selected.size} 类`;}));
 $('select-all').addEventListener('click',()=>{selected=new Set(cats.filter(([k])=>r[k]).map(([k])=>k));document.querySelectorAll('[data-remove]').forEach(i=>i.checked=selected.has(i.dataset.remove));$('delete-selected').disabled=!selected.size;$('delete-selected').textContent=`删除 ${selected.size} 类`});
 $('delete-selected').addEventListener('click',()=>{if(!selected.size)return;const names=cats.filter(([k])=>selected.has(k)).map(x=>x[1]);pendingDelete=[...selected];$('sheet-body').innerHTML=`<div class="confirm-panel"><h3>确认删除所选 ${names.length} 类？</h3><p>${titleDate(day)}：${names.join('、')}。</p><p>这是演示删除，不影响真实数据。生产版本将先核对准确数量、睡眠归属日和计划事项，并保证失败时不发生部分清空。</p><div class="confirm-actions"><button id="cancel-delete">返回检查</button><button id="confirm-delete">确认删除</button></div></div>`;
 $('cancel-delete').onclick=()=>{pendingDelete=null;renderSheet();$('manage-acc').open=true};$('confirm-delete').onclick=()=>{for(const k of pendingDelete||[])delete records[day][k];selected.clear();detail=null;pendingDelete=null;renderCalendar();renderSheet();$('manage-acc').open=true;notice('原型演示：已删除所选类别')};});
 if(keepScroll)document.querySelector('.sheet').scrollTop=scroll;
}
function notice(msg){const toast=$('toast');toast.textContent=msg;toast.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>toast.style.display='none',2200)}
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}renderCalendar()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}renderCalendar()};
$('theme').onclick=()=>{const next=tone()==='dark'?'light':'dark';document.documentElement.dataset.theme=next;$('theme').textContent=next==='dark'?'切换浅色':'切换深色'};
$('close').onclick=closeSheet;$('overlay').addEventListener('click',event=>{if(event.target===$('overlay'))closeSheet()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('overlay').classList.contains('visible'))closeSheet()});
renderCalendar();
</script>
</body></html>
