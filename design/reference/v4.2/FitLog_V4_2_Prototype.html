.remaining-brief{font-size:11px;color:var(--sub);line-height:1.5;margin:4px 0 0;overflow-wrap:anywhere}
.remaining-compact-action{flex:0 0 auto;min-height:43px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--green-deep);font-weight:700;font-size:11px}
/* V4.2: return to the original compact meal rhythm. Only the chevron expands,
   while a quiet record shortcut is always present. No full-width action row. */
.meal-card{padding:0!important;overflow:hidden}
.meal-head{display:flex;align-items:center;gap:8px;padding:8px 10px 0;min-height:51px}
.meal-info{display:grid;gap:2px;min-width:0}
.meal-info strong{font-size:14px;font-weight:760}
.meal-info small{font-size:11px;color:var(--sub)}
.meal-kcal{flex:0 0 auto;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.meal-kcal small{font-size:10px;font-weight:500;color:var(--sub)}
.meal-toggle-quiet{width:36px;min-width:36px;min-height:44px;padding:0;border:0;background:transparent;color:var(--sub);border-radius:10px;display:grid;place-items:center}
.meal-toggle-quiet:focus-visible,.meal-record-quiet:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.meal-chevron{font-size:21px;line-height:1;display:inline-block;transition:transform .18s ease}
.meal-chevron.is-open{transform:rotate(180deg)}
.meal-chevron-spacer{display:block;flex:0 0 36px}
.meal-inline{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px 6px 48px}
.meal-inline .meal-items-preview{flex:1;min-width:0;padding:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;line-height:1.4;color:var(--sub)}
.meal-record-quiet{flex:0 0 auto;min-height:44px;padding:0 5px;background:transparent;border:0;border-radius:9px;color:var(--green-deep);font-size:12px;font-weight:760;white-space:nowrap}
.meal-record-quiet:hover,.meal-toggle-quiet:hover{background:var(--green-light)}
.meal-detail{padding-top:10px}
.meal-detail .meal-detail-foot{margin-top:9px;justify-content:flex-start}
/* Today's nutrition gaps are real, discrete values—not a naturally wrapping sentence. */
.remaining-compact{padding:10px 12px 12px;gap:8px;background:var(--surface2)}
.goal-compact-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.goal-compact-heading{display:grid;gap:2px;min-width:0}
.goal-compact-heading small{font-size:10px;line-height:1.35;color:var(--sub)}
.remaining-compact-action{min-height:40px;display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--green-deep);padding:0 3px 0 10px;font-weight:750;font-size:12px;white-space:nowrap}
.remaining-compact-action span{font-size:20px;font-weight:400;line-height:1}
.goal-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.goal-mini-item{min-width:0;min-height:47px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 9px}
.goal-mini-label{display:flex;align-items:center;gap:5px;font-size:10px;line-height:1.15;color:var(--sub)}
.goal-mini-dot{display:inline-block;width:5px;height:5px;flex:0 0 5px;border-radius:50%;background:var(--green)}
.goal-mini-dot-p{background:var(--blue)}.goal-mini-dot-c{background:var(--gold)}.goal-mini-dot-f{background:var(--clay)}
.goal-mini-item strong{font-size:12px;line-height:1.3;font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.goal-mini-item.is-above strong{color:var(--danger)}
.goal-empty{grid-column:1/-1;color:var(--sub);font-size:12px;margin:0;padding:7px 2px}
@media(max-width:355px){.meal-head{padding-inline:9px;gap:6px}.meal-inline{padding-left:46px;padding-right:9px}.meal-kcal{font-size:13px}.meal-record-quiet{font-size:11.5px}.remaining-compact{padding:9px}.goal-mini-item{padding:6px 7px}.goal-mini-item strong{font-size:11px}}
</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast-root"></div><script>
'use strict';
const catalog=[
{id:'oat',name:'燕麦',cal:379,p:13.2,c:67.7,f:6.5},
{id:'egg',name:'鸡蛋',cal:144,p:13,c:1,f:10},
{id:'yogurt',name:'无糖酸奶',cal:75,p:7,c:6,f:2.5},
{id:'rice',name:'米饭',cal:116,p:2.6,c:25.9,f:.3},
{id:'chicken',name:'鸡胸肉',cal:165,p:31,c:0,f:3.6},
{id:'broccoli',name:'西兰花',cal:35,p:2.4,c:7,f:.4},
{id:'salmon',name:'三文鱼',cal:208,p:20,c:0,f:13},
{id:'sweetpotato',name:'红薯',cal:86,p:1.6,c:20,f:.1},
{id:'banana',name:'香蕉',cal:89,p:1.1,c:23,f:.3},
{id:'milk',name:'牛奶',cal:62,p:3.3,c:4.8,f:3.4},
{id:'bread',name:'全麦面包',cal:247,p:13,c:41,f:4.2},
{id:'tofu',name:'北豆腐',cal:81,p:8,c:2,f:4.8},
{id:'almond',name:'杏仁',cal:579,p:21.2,c:21.6,f:49.9},
{id:'apple',name:'苹果',cal:52,p:.3,c:14,f:.2},
];
const mealInfo={breakfast:{name:'早餐',icon:'☀',hue:'gold'},lunch:{name:'午餐',icon:'◒',hue:'green'},dinner:{name:'晚餐',icon:'☾',hue:'blue'},snack:{name:'加餐',icon:'✦',hue:'clay'}};
const initialLogs=[['oat',75,'breakfast'],['egg',100,'breakfast'],['yogurt',150,'breakfast'],['rice',230,'lunch'],['chicken',165,'lunch'],['broccoli',150,'lunch'],['salmon',150,'dinner'],['sweetpotato',240,'dinner'],['banana',120,'snack'],['milk',220,'snack']].map(([id,g,meal],i)=>({id:'seed'+i,foodId:id,g:+g,meal}));
const initialTasks=[{id:1,title:'晨间拉伸',tag:'健康',time:'07:30',date:'today',done:true},{id:2,title:'力量训练 · 上肢',tag:'训练',time:'18:30',date:'today',done:false},{id:3,title:'准备晚餐食材',tag:'生活',time:'',date:'today',done:false},{id:4,title:'整理明天的待办',tag:'日常',time:'',date:'today',done:false},{id:5,title:'补充蛋白质食品',tag:'饮食',time:'',date:'today',done:true},{id:6,title:'预约体检',tag:'健康',time:'10:00',date:'tomorrow',done:false},{id:7,title:'周末采购',tag:'生活',time:'',date:'week',done:false},{id:8,title:'阅读训练计划',tag:'日常',time:'',date:'inbox',done:false}];
const state={page:'today',theme:'light',scene:'normal',goals:{cal:2200,p:159,c:250,f:70},weight:75,logs:structuredClone(initialLogs),tasks:structuredClone(initialTasks),planTab:'today',expandedMeal:null,reportDetails:false,modal:null,taskFilter:'all',historyDraft:[],showTraining:false};
const nf=n=>Number(n).toLocaleString('zh-CN',{maximumFractionDigits:1});const nice=n=>Number.isFinite(n)?nf(n):'—';const food=id=>catalog.find(x=>x.id===id);const plus=(x)=>`${x>0?'+':''}${nf(x)}`;
const sanitize=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const target=()=>state.scene==='no-goal'?{cal:undefined,p:undefined,c:undefined,f:undefined}:state.goals;
function foodNumbers(f,g){const s=g/100;return {cal:f.cal*s,p:f.p*s,c:f.c*s,f:f.f*s}}
function metric(){let acc={cal:0,p:0,c:0,f:0};for(const log of state.logs){const a=foodNumbers(food(log.foodId),log.g);for(const k of Object.keys(acc))acc[k]+=a[k]}
if(state.scene==='over'){const a=foodNumbers({cal:350,p:12,c:35,f:20},200);for(const k of Object.keys(acc))acc[k]+=a[k]}
return acc}
const hasPartial=k=>state.scene==='partial'&&k==='p';
function status(k,actual){const t=target()[k];if(hasPartial(k))return {type:'unknown',text:'数据不完整'};if(t===undefined)return {type:'unset',text:'未设置目标'};const delta=actual-t;if(delta>0.05)return {type:'above',text:`超出 ${nf(delta)} ${k==='cal'?'kcal':'g'}`,diff:delta};if(delta<-.05)return {type:'below',text:`还差 ${nf(-delta)} ${k==='cal'?'kcal':'g'}`,diff:delta};return {type:'reached',text:'已达目标',diff:0}}
function pct(k,actual){const t=target()[k];return t===undefined||t<=0||hasPartial(k)?0:Math.max(0,Math.min(100,actual/t*100))}
function labelStatus(k,actual){const s=status(k,actual);return s.type==='above'?`<span class="status-strong over">${s.text}</span>`:s.type==='below'?`<span class="status-strong">${s.text}</span>`:`<span class="muted">${s.text}</span>`}
const meatxt=meal=>mealInfo[meal].name;
function budget(compact=false){const a=metric().cal,t=target().cal,s=status('cal',a),ov=s.type==='above',amount=nice(a);
return `<div class="budget-card ${compact?'compact-budget':''}"><div class="budget-head"><div class="grow"><div class="caption">${compact?'今日热量':'今日热量摄入'}</div><div class="budget-number"><strong class="value-huge">${amount}</strong><span class="u">kcal</span></div><div class="hero-note">${t===undefined?'尚未设置热量目标':`目标 ${nf(t)} kcal`}</div></div><div class="status-side"><b class="${ov?'status-strong over':'status-strong'}">${s.text}</b><small>${ov?'超出部分单独标示':s.type==='below'?'根据真实饮食记录':'今日摄入状态'}</small></div></div><div><div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:${pct('cal',a)}%"></div></div>${ov?`<div class="bar-over-track"><div class="bar-over" style="width:${Math.min(100,100*s.diff/Math.max(1,t))}%"></div></div>`:''}</div><div class="bar-text"><span>${t===undefined?'实际摄入，无目标比例':ov?'已达到设定目标':s.type==='below'?`${Math.round(pct('cal',a))}% 已摄入`:'达到目标'}</span><span>${ov?`额外 +${nf(s.diff)} kcal`:t===undefined?'——':`目标 ${nf(t)} kcal`}</span></div></div></div>`}
const macroMeta=[{k:'p',name:'蛋白质',color:'var(--blue)',icon:'●'},{k:'c',name:'碳水',color:'var(--gold)',icon:'●'},{k:'f',name:'脂肪',color:'var(--clay)',icon:'●'}];
function macros(compact=false){const a=metric(),t=target();return `<div class="macro-grid">${macroMeta.map(m=>`<div class="macro ${compact?'macro-compact':''}"><div class="macro-name"><span class="dot" style="background:${m.color}"></span>${m.name}</div><div class="macro-number">${hasPartial(m.k)?'—':nf(a[m.k])}<span class="u"> g</span></div><div class="macro-target">${t[m.k]===undefined?'未设目标':`目标 ${nf(t[m.k])} g`}</div><div class="mini-track"><i style="width:${pct(m.k,a[m.k])}%;background:${m.color}"></i></div><div class="macro-gkg">${hasPartial(m.k)?'营养数据不完整':state.weight>0?`${(a[m.k]/state.weight).toFixed(2)} g/kg`:'无有效体重'}</div></div>`).join('')}</div>`}
function gapBlock(compact=false){const a=metric(),t=target(),names=[['cal','热量','kcal'],['p','蛋白质','g'],['c','碳水','g'],['f','脂肪','g']];const rows=names.filter(([k])=>t[k]!==undefined).map(([k,name,unit])=>{const v=status(k,a[k]);return {name,text:v.type==='unknown'?'数据不完整':v.type==='reached'?'已达目标':v.type==='unset'?'未设目标':`${v.type==='above'?'超出':'还差'} ${nf(Math.abs(v.diff))} ${unit}`,type:v.type,key:k}});if(compact){const squares=rows.length?rows.map(r=>{const short=r.type==='unknown'?'数据不完整':r.type==='reached'?'已达标':r.type==='unset'?'未设目标':r.text.replace(/^还差 /,'差 ').replace(/^超出 /,'超 ');return `<div class="goal-mini-item ${r.type==='above'?'is-above':''}"><span class="goal-mini-label"><i aria-hidden="true" class="goal-mini-dot goal-mini-dot-${r.key}"></i>${r.name}</span><strong title="${r.text}">${short}</strong></div>`}).join(''):'<p class="goal-empty">尚未设置营养目标，可以前往饮食页设置。</p>';return `<section class="remaining remaining-compact"><div class="goal-compact-top"><div class="goal-compact-heading"><h3 class="remaining-title">剩余目标</h3><small>按当日实际记录计算</small></div><button class="remaining-compact-action" data-action="navigate-fill" aria-label="前往饮食页面补齐营养">去补齐 <span aria-hidden="true">›</span></button></div><div class="goal-mini-grid">${squares}</div></section>`}
const cells=rows.length?rows.map(r=>`<div class="gap-item"><small>${r.name}</small><strong class="${r.type==='above'?'danger':''}">${r.text}</strong></div>`).join(''):'<div class="remaining-brief" style="grid-column:1/-1">尚未设置营养目标，可以从上方设置。</div>';
return `<section class="remaining"><div class="remaining-heading"><h3 class="remaining-title">剩余目标</h3><span class="remaining-caption">按实际记录计算 · 点击选择补齐方式</span></div><div class="gap-grid">${cells}</div><div class="remaining-actions"><button data-action="open-fill-smart" class="remaining-action"><span aria-hidden="true">✧</span> 智能补齐 <span aria-hidden="true">›</span></button><button data-action="open-fill-custom" class="remaining-action"><span aria-hidden="true">≡</span> 指定食物 <span aria-hidden="true">›</span></button></div></section>`}
function todayTaskList(){const tasks=state.tasks.filter(x=>x.date==='today').sort((a,b)=>Number(a.done)-Number(b.done)||a.time.localeCompare(b.time));return `<section class="card"><div class="section-header"><h2>今日计划</h2><button class="link-btn" data-action="goto-plan">查看全部 ›</button></div><div class="flex between" style="margin:8px 0 7px"><span class="caption">已完成 ${tasks.filter(x=>x.done).length} / ${tasks.length} 项</span><span class="tag">保持节奏</span></div><div class="progress-mini"><i style="width:${tasks.length?tasks.filter(x=>x.done).length/tasks.length*100:0}%"></i></div>${tasks.filter(x=>!x.done).slice(0,3).map(t=>taskRow(t)).join('')}${tasks.filter(x=>!x.done).length===0?'<div class="caption" style="padding-top:14px">今天的任务都已完成 ✓</div>':''}</section>`}
function taskRow(t){return `<div class="today-task-row"><button class="check ${t.done?'done':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done?'标为未完成':'完成任务'}：${sanitize(t.title)}">${t.done?'✓':''}</button><span class="task-title ${t.done?'done':''}">${sanitize(t.title)}</span>${t.time?`<time class="task-time">${t.time}</time>`:`<span class="task-tag">${sanitize(t.tag)}</span>`}</div>`}
function actRow(icon,title,desc,btn,action,hue=''){return `<div class="today-action"><span class="icon-pill ${hue}">${icon}</span><div class="action-info"><strong>${title}</strong><span>${desc}</span></div><button class="secondary" data-action="${action}">${btn}</button></div>`}
function today(){const a=metric(),n=state.tasks.filter(t=>t.date==='today'&&!t.done).length;return `<main class="page" data-view="today"><section class="card accent-hero"><div class="eyebrow">TODAY · OVERVIEW</div><h2 style="font-size:23px;letter-spacing:-.04em;margin:9px 0 6px">今天，继续保持自己的节奏</h2><p class="caption" style="max-width:290px;margin:0">还有 ${n} 项待办。训练与饮食的每次记录，都会积累成看得见的变化。</p></section>${todayTaskList()}<section class="card"><div class="section-header"><h2>今日饮食</h2><button class="link-btn" data-action="goto-food">查看详情 ›</button></div><div style="margin-top:9px">${budget(true)}</div><div class="divider" style="margin:15px 0 12px"></div>${macros(true)}<div style="margin-top:12px">${gapBlock(true)}</div></section><section class="card"><div class="section-header"><h2>训练与身体</h2><button class="link-btn" data-action="goto-training">训练详情 ›</button></div>${actRow('◈','力量训练',state.showTraining?'正在训练 · 4个动作':'今天尚未开始力量训练',state.showTraining?'继续训练':'记录训练','toggle-training')}${actRow('◎','体重','上次记录 75.0 kg','记录体重','record-weight','blue')}${actRow('✳','凯格尔训练','今日尚未记录','开始训练','start-pelvic','gold')}</section><section class="card"><div class="section-header"><h2>习惯与恢复</h2><button class="link-btn" data-action="goto-progress">查看趋势 ›</button></div><div class="flex" style="margin-top:10px"><span class="icon-pill gold">◉</span><div class="grow"><b style="font-size:13px">睡眠与饮水</b><p class="caption" style="margin:4px 0 0">睡眠 7小时40分 · 饮水 1,850ml</p></div><span class="tag">演示数据</span></div></section>${demoNote()}</main>`}
function demoNote(){return `<div class="notice">交互原型 · 所有数值和记录都是本页演示数据，不连接实际 FitLog Lite 账户，也不会修改正式应用。</div>`}
function plan(){const tab=state.planTab,ts=state.tasks.filter(x=>tab==='today'?x.date==='today':tab==='upcoming'?x.date==='tomorrow'||x.date==='week':x.date==='inbox');const total=state.tasks.filter(x=>x.date==='today'),done=total.filter(x=>x.done).length;
const content=tab==='today'?`<section class="card"><div class="flex between"><b style="font-size:14px">今日进度</b><span class="caption">${done} / ${total.length} 已完成</span></div><div class="progress-mini" style="margin:12px 0 5px"><i style="width:${total.length?done/total.length*100:0}%"></i></div><p class="tiny">专注未完成的事项，已完成任务可折叠查看。</p></section><div class="plan-section-title">时间安排</div><section class="card" style="padding:5px 14px">${ts.filter(x=>x.time&&!x.done).map(taskRow).join('')||'<div class="empty">暂无指定时间的任务</div>'}</section><div class="plan-section-title">待办</div><section class="card" style="padding:5px 14px">${ts.filter(x=>!x.time&&!x.done).map(taskRow).join('')||'<div class="empty">当前待办已经完成</div>'}</section>${ts.some(x=>x.done)?`<section class="card" style="padding:5px 14px"><details><summary style="padding:12px 3px;font-size:13px;color:var(--sub);font-weight:700">已完成 ${ts.filter(x=>x.done).length} 项</summary>${ts.filter(x=>x.done).map(taskRow).join('')}</details></section>`:''}`:tab==='upcoming'?`<div class="plan-section-title">明天</div><section class="card" style="padding:5px 14px">${ts.filter(x=>x.date==='tomorrow').map(taskRow).join('')||'<div class="empty">明天没有安排</div>'}</section><div class="plan-section-title">本周稍后</div><section class="card" style="padding:5px 14px">${ts.filter(x=>x.date==='week').map(taskRow).join('')||'<div class="empty">本周暂无安排</div>'}</section>`:`<section class="card" style="padding:5px 14px">${ts.map(taskRow).join('')||'<div class="empty">收件箱是空的，想到什么就记下来</div>'}</section>`;
return `<main class="page" data-view="plan"><section class="card accent-hero"><div class="eyebrow">YOUR SCHEDULE</div><div class="flex between" style="margin-top:8px"><div><h2 class="title">让安排清晰，让执行轻松</h2><div class="caption" style="margin-top:5px">按时间、状态和标签组织任务</div></div><span style="font-size:30px;color:var(--green)">▤</span></div></section><div class="plan-tab-row" role="tablist" aria-label="计划视图">${[['today','今天'],['upcoming','近期'],['inbox','收件箱']].map(([k,n])=>`<button role="tab" class="plan-tab ${tab===k?'active':''}" data-action="plan-tab" data-tab="${k}" aria-selected="${tab===k}">${n}</button>`).join('')}</div>${content}<button class="primary plan-add" data-action="new-task">＋ 添加任务</button>${demoNote()}</main>`}
function mealCard(meal){const logs=state.logs.filter(x=>x.meal===meal),meta=mealInfo[meal],sum=logs.reduce((a,l)=>a+foodNumbers(food(l.foodId),l.g).cal,0),open=state.expandedMeal===meal,items=logs.map(l=>food(l.foodId).name);return `<section class="card meal-card" data-meal="${meal}"><div class="meal-head"><span class="icon-pill ${meta.hue==='green'?'':meta.hue}" aria-hidden="true">${meta.icon}</span><div class="meal-info grow"><strong>${meta.name}</strong><small>${logs.length?`${logs.length} 项记录`:'本餐尚未记录'}</small></div><span class="meal-kcal">${nf(sum)} <small>kcal</small></span>${logs.length?`<button type="button" class="meal-toggle-quiet" data-action="meal-toggle" data-meal="${meal}" aria-label="${open?'收起':'展开'}${meta.name}明细" aria-expanded="${open}" aria-controls="meal-detail-${meal}" title="${open?'收起':'展开'}${meta.name}明细"><span aria-hidden="true" class="meal-chevron ${open?'is-open':''}">⌄</span></button>`:'<span class="meal-chevron-spacer" aria-hidden="true"></span>'}</div><div class="meal-inline"><div class="meal-items-preview">${items.length?items.slice(0,3).join(' · ')+(items.length>3?' · …':''):'添加今天实际吃下的食物'}</div><button type="button" class="meal-record-quiet" data-action="log-meal" data-meal="${meal}" aria-label="直接记录${meta.name}食物">＋ 记录</button></div>${open&&logs.length?`<div class="meal-detail" id="meal-detail-${meal}"><div class="meal-macro-line">${meta.name} · 已记录食物明细</div>${logs.map(log=>{const f=food(log.foodId),a=foodNumbers(f,log.g);return `<article><div class="grow"><strong>${f.name}</strong><small>${nf(log.g)} g · ${nf(a.p)}g 蛋白质 · ${nf(a.c)}g 碳水</small></div><div style="text-align:right"><b style="font-size:12px">${nf(a.cal)} kcal</b><button style="display:block;margin:5px 0 0 auto" class="tiny-btn danger" data-action="delete-log" data-id="${log.id}">删除</button></div></article>`}).join('')}<div class="meal-detail-foot"><span class="tiny">共 ${logs.length} 项 · ${nf(sum)} kcal</span></div></div>`:''}</section>`}
function foodPage(){return `<main class="page" data-view="food"><section class="card accent-hero"><div class="section-header"><h2>饮食总览</h2><button class="link-btn" data-action="edit-goals">编辑目标 ›</button></div><div style="margin-top:10px">${budget()}</div><div class="divider" style="margin:13px 0 12px"></div><div class="flex between"><b style="font-size:12px">三大宏量营养素</b><span class="tiny">实际摄入优先 · g/kg 保留</span></div><div style="margin-top:9px">${macros()}</div></section>${gapBlock()}<div class="section-header"><h2>今日餐次</h2><span>每餐都可以连续记录</span></div><div class="stack">${Object.keys(mealInfo).map(mealCard).join('')}</div><section class="card" style="padding:13px"><div class="flex between"><div><b class="small-title">保存常用饮食组合</b><p class="tiny" style="margin:3px 0 0">已保存的食物仍保留真实克数</p></div><button class="tertiary" data-action="save-template">保存模板</button></div></section>${demoNote()}</main>`}
function reportTile(name,k,color){const a=metric()[k],t=target()[k],s=status(k,a);return `<article class="report-tile" data-report-card="${k}"><div class="report-name">${name}</div><div class="report-values"><div class="actual-value">${hasPartial(k)?'—':nf(a)} <small>${k==='cal'?'kcal':'g'}</small></div><div class="target-value">${t===undefined?'未设置同日目标':`目标 ${nf(t)} ${k==='cal'?'kcal':'g'}`}</div></div><div class="track"><i style="width:${pct(k,a)}%;background:${color}"></i></div><div class="status">${s.type==='unknown'?'数据不完整':s.type==='above'?`超出 ${nf(s.diff)}`:s.type==='below'?`已摄入 ${Math.round(pct(k,a))}%`:s.type==='unset'?'无目标比例':'已达目标'}</div></article>`}
function progress(){return `<main class="page" data-view="progress"><section class="card accent-hero"><div class="eyebrow">REPORT PREVIEW</div><h2 style="margin:9px 0 4px;font-size:20px">报告 · 营养与饮食执行</h2><p class="caption">V4 本次只预览需要修正的营养卡片，其他专业分析继续沿用 V3.1。</p></section><section class="card"><div class="section-header"><h2>饮食与营养执行</h2><span>同日完整记录演示</span></div><div class="flex between" style="margin:12px 0"><span class="caption">实际摄入为主，目标为辅</span><span class="tag">四卡严格等大</span></div><div class="report-grid">${reportTile('热量','cal','var(--green)')}${reportTile('蛋白质','p','var(--blue)')}${reportTile('碳水','c','var(--gold)')}${reportTile('脂肪','f','var(--clay)')}</div><button class="action-link" data-action="report-details" aria-expanded="${state.reportDetails}"><span class="grow"><b>记录覆盖与统计口径</b><small>统一放在卡片下方，不让四卡高度错位</small></span><span class="arr">${state.reportDetails?'⌃':'›'}</span></button>${state.reportDetails?`<div class="report-detail">本区块为单日演示，所有饮食来自原型的食物记录。正式报告中继续分别展示每项营养素的完整记录天数、同日配对天数与部分记录天数。缺失不能按零计入平均值；没有同日有效目标时不计算进度比例。</div>`:''}</section><section class="card"><h2 class="title">设计规则</h2><p class="caption" style="line-height:1.8;margin-bottom:0">四卡统一列宽、行高、主数值位置与进度条基线；目标缺失、超出和数据不完整时仍不破坏对齐。字体放大时可整体切换单列。</p></section>${demoNote()}</main>`}

function sceneControls(){return `<section class="card" style="padding:12px 14px"><div class="flex between"><div class="small-title">视觉状态对照</div><span class="tiny">仅原型 · 不修改真实数据</span></div><div class="scenario-strip" style="margin-top:10px">${[['normal','未达标'],['over','热量超标'],['no-goal','未设目标'],['partial','数据不完整']].map(([k,n])=>`<button class="scene-btn ${state.scene===k?'on':''}" data-action="scene" data-scene="${k}">${n}</button>`).join('')}</div></section>`}
function render(){document.documentElement.dataset.theme=state.theme;let html=header()+`<div id="page-content">${state.page==='today'?today():state.page==='plan'?plan():state.page==='food'?foodPage():state.page==='progress'?progress():training()}</div>`+footnav();document.getElementById('app').innerHTML=html;const page=document.getElementById('page-content').firstElementChild;page.insertAdjacentHTML('afterbegin',sceneControls());if(state.modal)drawModal()}
function notify(s){const holder=document.getElementById('toast-root');holder.innerHTML=`<div class="toast" role="status">${sanitize(s)}</div>`;clearTimeout(notify.id);notify.id=setTimeout(()=>holder.innerHTML='',2000)}
function route(p){state.page=p;state.modal=null;document.getElementById('modal-root').innerHTML='';render();window.scrollTo({top:0,behavior:'instant'})}
function openModal(m){state.modal=m;drawModal()}
function modalFrame(title,body,footer=''){return `<div class="modal-cover"><div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-top"><h2>${title}</h2><button class="close-btn" data-action="close-modal" aria-label="关闭">×</button></div><div class="sheet-body">${body}</div>${footer?`<div class="sheet-footer">${footer}</div>`:''}</div></div>`}
function selectedMealList(meal){const rows=state.logs.filter(x=>x.meal===meal);const k=rows.reduce((s,l)=>s+foodNumbers(food(l.foodId),l.g).cal,0);return `<div class="selected-summary"><div class="flex between"><b class="small-title">${meatxt(meal)}已记录</b><span class="tag">${rows.length} 项 · ${nf(k)} kcal</span></div>${rows.length?rows.slice(-4).map(l=>`<div class="selected-line"><span>${food(l.foodId).name} · ${nf(l.g)}g</span><b>${nf(foodNumbers(food(l.foodId),l.g).cal)} kcal</b></div>`).join(''):'<span class="caption">还没有食物，选择下面的食物开始记录。</span>'}</div>`}
function drawModal(){const modal=state.modal;if(!modal){document.getElementById('modal-root').innerHTML='';return}
let title='',body='',footer='';if(modal.kind==='log'){title='记录'+meatxt(modal.meal);if(modal.step==='search'){body=`<div class="flex between"><b class="small-title">连续添加食物</b><span class="tag">保存后不退出</span></div>${selectedMealList(modal.meal)}<input class="food-search" id="food-search" type="search" autocomplete="off" placeholder="搜索食物（例如鸡胸肉、米饭）" value="${sanitize(modal.search||'')}"><div class="stack" id="food-options">${foodOptions(modal.search||'')}</div>`;footer=`<button class="tertiary" data-action="close-modal">完成本餐记录</button><button class="secondary" data-action="open-new-food">＋ 新建食物</button>`}
else{const f=food(modal.foodId),a=foodNumbers(f,modal.grams);body=`<button class="link-btn" data-action="back-food-search" style="justify-self:start">‹ 返回食物列表</button><div class="quantity-preview"><div class="caption">${f.name} · 每100g ${nf(f.cal)} kcal</div><div class="value-large" style="margin:10px 0">${nf(a.cal)} <span class="u">kcal</span></div><div class="caption">蛋白质 ${nf(a.p)}g · 碳水 ${nf(a.c)}g · 脂肪 ${nf(a.f)}g</div></div><div class="small-title">实际食用重量</div><div class="quantity-counter"><button class="qty-btn" data-action="qty-minus" aria-label="减少5克">−</button><input class="qty-input" id="food-grams" type="number" inputmode="decimal" min="5" step="5" max="400" value="${modal.grams}" aria-label="克数"><span class="u">g</span><button class="qty-btn" data-action="qty-plus" aria-label="增加5克">＋</button></div><div class="caption" style="text-align:center">调整克数后实时预览预计营养值。</div>${selectedMealList(modal.meal)}`;footer=`<button class="tertiary" data-action="back-food-search">换一种食物</button><button class="primary" data-action="save-food-log">保存并继续添加</button>`}}
else if(modal.kind==='fill'){title='帮我补齐今日营养';const a=metric(),tg=target();const list=[['cal','热量','kcal'],['p','蛋白质','g'],['c','碳水','g'],['f','脂肪','g']];const gap=list.filter(([k])=>tg[k]!==undefined).map(([k,name,unit])=>`<div class="preview-stat"><small>${name}</small><strong>${status(k,a[k]).text}</strong></div>`).join('');body=`<div class="notice">演示算法只根据已有食物营养成分和今日差额计算建议重量。预览不会被记录为已经吃下。</div><div class="preview-stats">${gap||'<div class="caption">先设置营养目标再使用补齐功能</div>'}</div><div class="plan-tab-row"><button class="plan-tab ${modal.mode==='smart'?'active':''}" data-action="fill-mode" data-mode="smart">智能推荐</button><button class="plan-tab ${modal.mode==='custom'?'active':''}" data-action="fill-mode" data-mode="custom">指定食物</button></div>${modal.mode==='custom'?`<div class="flex between"><b class="small-title">只使用我勾选的食物</b><span class="tiny">最多 4 种</span></div><div class="stack" id="fill-food-list">${catalog.map(f=>`<label class="picker-food"><span><strong>${f.name}</strong><small>每100g ${nf(f.cal)} kcal · 蛋白质 ${nf(f.p)}g</small></span><input class="picker-check" type="checkbox" data-choose-food="${f.id}" ${modal.selected.includes(f.id)?'checked':''}></label>`).join('')}</div>`:`<div class="caption">系统从食物库评估不同食物组合；你也可以切换到「指定食物」模式。</div>`}<button class="primary wide" data-action="fill-calculate" ${modal.mode==='custom'&&!modal.selected.length?'disabled':''}>计算建议组合</button>${modal.results?fillPreview(modal):''}`;
footer=`<button class="tertiary wide" data-action="close-modal">稍后再说</button>`}
else if(modal.kind==='confirm-fill'){title='确认实际摄入';const items=modal.items||[];body=`<div class="notice">以下是建议组合，确认之前不会写入饮食记录。请仅在实际吃下后选择所属餐次。</div><div class="selected-summary">${items.map(x=>`<div class="selected-line"><span>${food(x.id).name}</span><b>${x.g}g</b></div>`).join('')}</div><label class="input-label" for="fill-meal">记录到哪一餐？</label><select class="form-field" id="fill-meal">${Object.entries(mealInfo).map(([id,v])=>`<option value="${id}">${v.name}</option>`).join('')}</select>`;footer=`<button class="tertiary" data-action="back-fill">返回调整</button><button class="primary" data-action="apply-fill">确认已经吃下并记录</button>`}
else if(modal.kind==='task'){title='添加任务';body=`<label><span class="input-label">任务名称</span><input class="form-field" id="task-name" placeholder="写下需要完成的事" value=""></label><label><span class="input-label">所属日期</span><select class="form-field" id="task-date"><option value="today">今天</option><option value="tomorrow">明天</option><option value="week">本周稍后</option><option value="inbox">收件箱</option></select></label>`;footer=`<button class="tertiary" data-action="close-modal">取消</button><button class="primary" data-action="submit-task">保存任务</button>`}
else if(modal.kind==='goals'){title='设置营养目标';body=`<div class="caption">可以单独设置各项目标；留空代表没有目标。</div>${[['cal','热量','kcal'],['p','蛋白质','g'],['c','碳水','g'],['f','脂肪','g']].map(([k,n,u])=>`<label><span class="input-label">${n} (${u})</span><input class="form-field" data-goal="${k}" type="number" inputmode="decimal" min="0" step="1" value="${state.goals[k]??''}"></label>`).join('')}`;footer=`<button class="tertiary" data-action="close-modal">取消</button><button class="primary" data-action="save-goals">保存目标</button>`}
else if(modal.kind==='food-create'){title='新建食物（演示）';body=`<label><span class="input-label">食物名称</span><input id="new-food-name" class="form-field" placeholder="食物名称"></label>${[['cal','热量 kcal'],['p','蛋白质 g'],['c','碳水 g'],['f','脂肪 g']].map(([k,n])=>`<label><span class="input-label">每100g ${n}</span><input class="form-field" id="new-food-${k}" type="number" min="0" step="0.1" placeholder="0"></label>`).join('')}`;footer=`<button class="tertiary" data-action="back-log">返回</button><button class="primary" data-action="save-new-food">保存到演示食物库</button>`}
document.getElementById('modal-root').innerHTML=modalFrame(title,body,footer)}
function foodOptions(query){const q=query.trim().toLowerCase();return catalog.filter(f=>f.name.toLowerCase().includes(q)||f.id.includes(q)).map(f=>`<button class="picker-food" data-action="choose-food" data-id="${f.id}"><span><strong>${f.name}</strong><small>每100g ${nf(f.cal)} kcal · 蛋白质 ${nf(f.p)} g</small></span><span style="font-size:18px;color:var(--green)">›</span></button>`).join('')||'<div class="empty">没有找到食物。可新建到演示食物库。</div>'}
function optimize(ids){const f=ids.map(food).filter(Boolean),a=metric(),t=target(),keys=['cal','p','c','f'].filter(k=>t[k]!==undefined&&!hasPartial(k)),floors={cal:200,p:20,c:30,f:10};if(!keys.length)return null;let grams=f.map(()=>0);
function score(g){let val=0;const added={cal:0,p:0,c:0,f:0};f.forEach((food,i)=>{const z=foodNumbers(food,g[i]);keys.forEach(k=>added[k]+=z[k])});keys.forEach(k=>{const remain=t[k]-a[k],d=(added[k]-remain)/Math.max(floors[k],t[k]);val+=d*d*(d>0?(remain<=0?8:1.8):1)});val+=g.filter(x=>x>0).length*.0004;return val}
let best=score(grams);for(let step=0;step<160;step++){let choice=null,val=best;for(let i=0;i<f.length;i++){for(const d of [5,-5]){const gg=grams.slice();gg[i]+=d;if(gg[i]<0||gg[i]>400||gg.reduce((s,x)=>s+x,0)>800)continue;const trial=score(gg);if(trial<val-1e-10){val=trial;choice=gg}}}if(!choice)break;grams=choice;best=val}const items=f.map((ff,i)=>({id:ff.id,g:grams[i]})).filter(x=>x.g>0);if(!items.length)return null;let added={cal:0,p:0,c:0,f:0};for(const x of items){const v=foodNumbers(food(x.id),x.g);for(const k of Object.keys(added))added[k]+=v[k]};return {items,added,score:best,projected:Object.fromEntries(Object.keys(added).map(k=>[k,a[k]+added[k]]))}}
function fillCompute(modal){let ids=modal.mode==='custom'?modal.selected:catalog.map(x=>x.id);if(modal.mode==='custom'&&(!ids.length||ids.length>4))return [];const variants=[];
if(modal.mode==='custom'){const p=optimize(ids);if(p)variants.push(p)}else{const a=metric(),tg=target();const prioritized=catalog.map(f=>{let score=0;const t={cal:2200,p:159,c:250,f:70};for(const k of Object.keys(t)){if(tg[k]===undefined)continue;const gap=Math.max(0,tg[k]-a[k]);score+=(gap/Math.max(tg[k],10))*f[k]/Math.max(tg[k],10)}return{f,score}}).sort((a,b)=>b.score-a.score).slice(0,9).map(x=>x.f.id);
for(const set of [[...prioritized.slice(0,4)],...prioritized.slice(0,4).map((_,i)=>prioritized.filter((_,j)=>i!==j).slice(0,4)),...prioritized.slice(0,4).map((x,i)=>[x,...prioritized.slice(4,8).slice(i,i+2)])]){const r=optimize(set);if(r&&!variants.some(v=>v.items.map(x=>x.id).sort().join(',')===r.items.map(x=>x.id).sort().join(',')))variants.push(r)}variants.sort((a,b)=>a.score-b.score);}
return variants.slice(0,3)}
function fillPreview(modal){if(!modal.results.length)return `<div class="notice">当前所选食物组合无法进一步改善可确定的目标，或者目标已经满足。可以换一种食物，或者直接记录实际食用量。</div>`;return `<div class="stack"><b class="small-title">建议结果 · 实际克数仍需确认</b>${modal.results.map((plan,i)=>`<section class="selected-summary"><div class="flex between"><b style="font-size:13px">组合 ${i+1}</b><span class="tag">${modal.mode==='custom'?'仅用指定食物':'来自食物库'}</span></div>${plan.items.map(x=>`<div class="selected-line"><span>${food(x.id).name}</span><b>${x.g} g</b></div>`).join('')}<div class="divider"></div><div class="preview-stats">${[['cal','热量','kcal'],['p','蛋白质','g'],['c','碳水','g'],['f','脂肪','g']].map(([k,n,u])=>`<div class="preview-stat"><small>${n} · 补充后</small><strong>${nf(plan.projected[k])} ${u}</strong><small>${target()[k]===undefined?'未设目标':`目标 ${nf(target()[k])}`}</small></div>`).join('')}</div><button class="secondary wide" data-action="fill-choose-result" data-index="${i}">选择此组合并确认实际摄入 →</button></section>`).join('')}</div>`}
const actions={nav:(el)=>route(el.dataset.tab),theme:()=>{state.theme=state.theme==='light'?'dark':'light';render()},scene:(el)=>{state.scene=el.dataset.scene;render()},'goto-plan':()=>route('plan'),'goto-food':()=>route('food'),'goto-training':()=>route('training'),'goto-progress':()=>route('progress'),'navigate-fill':()=>{route('food');openModal({kind:'fill',mode:'smart',selected:['chicken','rice'],results:null})},'open-fill-smart':()=>openModal({kind:'fill',mode:'smart',selected:['chicken','rice'],results:null}),'open-fill-custom':()=>openModal({kind:'fill',mode:'custom',selected:['chicken','rice'],results:null}),
'plan-tab':el=>{state.planTab=el.dataset.tab;render()},'toggle-task':el=>{const t=state.tasks.find(x=>x.id===Number(el.dataset.id));if(t){t.done=!t.done;render();notify(t.done?'任务已完成':'已恢复待办')}},'new-task':()=>openModal({kind:'task'}),'submit-task':()=>{const name=document.getElementById('task-name').value.trim(),date=document.getElementById('task-date').value;if(!name)return notify('请输入任务名称');state.tasks.push({id:Date.now(),title:name,tag:'新任务',time:'',date,done:false});closeModal();render();notify('任务已添加')},
'meal-toggle':el=>{const m=el.dataset.meal;state.expandedMeal=state.expandedMeal===m?null:m;render()},'log-meal':el=>openModal({kind:'log',meal:el.dataset.meal,step:'search',search:''}),
'choose-food':el=>{state.modal.step='qty';state.modal.foodId=el.dataset.id;state.modal.grams=100;drawModal()},'back-food-search':()=>{state.modal.step='search';drawModal()},'qty-minus':()=>{state.modal.grams=Math.max(5,state.modal.grams-5);drawModal()},'qty-plus':()=>{state.modal.grams=Math.min(400,state.modal.grams+5);drawModal()},
'save-food-log':()=>{const q=+document.getElementById('food-grams').value;if(!Number.isFinite(q)||q<=0||q>400)return notify('请输入 0–400g 内的合理重量');state.logs.push({id:'log'+Date.now(),foodId:state.modal.foodId,g:q,meal:state.modal.meal});state.expandedMeal=state.modal.meal;state.modal.step='search';state.modal.search='';render();notify('已保存，可继续添加下一种食物')},'delete-log':el=>{state.logs=state.logs.filter(l=>l.id!==el.dataset.id);render();notify('已删除演示记录')},
'fill-mode':el=>{state.modal.mode=el.dataset.mode;state.modal.results=null;drawModal()},'fill-calculate':()=>{state.modal.results=fillCompute(state.modal);drawModal()},'fill-choose-result':el=>{const origin=state.modal;const p=origin.results[Number(el.dataset.index)];state.modal={kind:'confirm-fill',items:p.items,origin};drawModal()},'back-fill':()=>{state.modal=state.modal.origin;drawModal()},'apply-fill':()=>{const meal=document.getElementById('fill-meal').value;const count=state.modal.items.length;state.modal.items.forEach((x,i)=>state.logs.push({id:'fill'+Date.now()+i,foodId:x.id,g:x.g,meal}));state.expandedMeal=meal;closeModal();render();notify(`已记录 ${count} 项实际摄入`)},
'edit-goals':()=>openModal({kind:'goals'}),'save-goals':()=>{const g={};for(const el of document.querySelectorAll('[data-goal]')){if(el.value.trim()!==''){const n=+el.value;if(!Number.isFinite(n)||n<0)return notify('目标数值不合法');g[el.dataset.goal]=n}else g[el.dataset.goal]=undefined}state.goals=g;state.scene='normal';closeModal();render();notify('目标已更新')},
'open-new-food':()=>openModal({kind:'food-create',parent:state.modal}),'save-new-food':()=>{const name=document.getElementById('new-food-name').value.trim();if(!name)return notify('请填写食物名称');const ff={id:'custom'+Date.now(),name};for(const k of ['cal','p','c','f']){const el=document.getElementById('new-food-'+k);if(el.value==='')return notify('请填写四项营养数据');ff[k]=Number(el.value);if(!Number.isFinite(ff[k])||ff[k]<0)return notify('营养数据必须合法')}catalog.unshift(ff);const parent=state.modal.parent;state.modal=parent;state.modal.step='search';state.modal.search=name;drawModal();notify('已加入演示食物库')},'back-log':()=>{state.modal=state.modal.parent;drawModal()},
'report-details':()=>{state.reportDetails=!state.reportDetails;render()},'close-modal':()=>closeModal(),'toggle-training':()=>{state.showTraining=!state.showTraining;render();notify(state.showTraining?'已演示进入训练状态':'已演示结束训练状态')},'record-weight':()=>notify('演示：正式体重录入流程保持原有功能'),'start-pelvic':()=>notify('演示：正式凯格尔训练流程保持原有功能'),'sample-action':()=>notify('本轮暂不修改有氧录入流程'),'save-template':()=>notify('演示：正式版会沿用原有保存饮食模板功能')};
function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML=''}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const fn=actions[el.dataset.action];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='food-search'&&state.modal?.kind==='log'){state.modal.search=el.value;document.getElementById('food-options').innerHTML=foodOptions(el.value)}else if(el.id==='food-grams'&&state.modal?.kind==='log'){const q=+el.value;if(Number.isFinite(q)&&q>0){state.modal.grams=q;const preview=el.closest('.sheet-body')?.querySelector('.quantity-preview');if(preview){const a=foodNumbers(food(state.modal.foodId),q);preview.querySelector('.value-large').innerHTML=`${nf(a.cal)} <span class="u">kcal</span>`;preview.querySelector('.caption:last-child').textContent=`蛋白质 ${nf(a.p)}g · 碳水 ${nf(a.c)}g · 脂肪 ${nf(a.f)}g`}}}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-choose-food]')&&state.modal?.kind==='fill'){const id=el.dataset.chooseFood;if(el.checked){if(state.modal.selected.length>=4){el.checked=false;return notify('一次最多指定4种食物')}state.modal.selected.push(id)}else state.modal.selected=state.modal.selected.filter(x=>x!==id);state.modal.results=null;const calculate=document.querySelector('[data-action="fill-calculate"]');if(calculate)calculate.disabled=!state.modal.selected.length}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});render();
