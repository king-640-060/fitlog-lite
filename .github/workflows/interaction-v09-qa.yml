name: Actual Pages Progress layout verification
on:
  push:
    branches: ['codex/progress-layout-v2-qa-*']
permissions:
  contents: read
jobs:
  browser:
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - tag: 'production-pwa-retry'
            task: 'pwa-upgrade'
            full: '0'
            width: ''
            shard: '2'
    env:
      QA_SHARD: ${{ matrix.shard }}
      QA_TAG: ${{ matrix.tag }}
      QA_ONLY: ${{ matrix.task }}
      QA_FULL_JOINT: ${{ matrix.full }}
      QA_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - name: Check and build identical product source
        run: |
          npm run typecheck
          npm test -- --maxWorkers=4
          npm run build
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/fitlog-pw" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/fitlog-pw/node_modules/playwright/cli.js" install chromium webkit
          echo "FITLOG_PLAYWRIGHT_MODULE=$RUNNER_TEMP/fitlog-pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Serve current and frozen old builds
        run: |
          python3 .qa-remote/setup-production.py
          sw_vers > .qa-remote/runner.txt
          node --version >> .qa-remote/runner.txt
      - name: Full nonpublishing regression shard
        run: node .qa-remote/run-production.mjs
      - name: Preserve actual evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: progress-layout-v2-pages-${{ matrix.tag }}
          path: |
            qa-production/
            .qa-remote/source-manifest.json
            .qa-remote/runner.txt
            dist/build-info.json
            .qa-remote/production-application-all-resources.json
          include-hidden-files: true
          retention-days: 14
